<title>Планировщик офиса продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: инструментальная панель сверху, библиотека слева, чертёж по центру, свойства справа. Палитра — чертёжная калька + синий карандаш. */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --paper:#ffffff; --ink:#1f2622; --muted:#66706a; --line:#d5d9d2;
  --accent:#1f5fa8; --accent-soft:#dbe7f5; --warn:#b4541e; --ok:#2e7d4f;
  --grid:#e9ece6; --grid-major:#d6dbd3; --wall:#3a3f3b; --glass:#8cc8ec; --glass-edge:#2a78b8; --dim:#b3392f; --sel:#1f5fa8;
  --font-ui:"Golos Text", "Segoe UI", system-ui, sans-serif; --font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a18; --panel:#1e2320; --paper:#232926; --ink:#e7ebe6; --muted:#9aa49d; --line:#343b37;
  --accent:#6aa6ea; --accent-soft:#223449; --warn:#e08a55; --ok:#5fbf86;
  --grid:#2a302c; --grid-major:#353d38; --wall:#c9cfca; --glass:#4b86ad; --glass-edge:#8cc8ec; --dim:#ef7a6e; --sel:#6aa6ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a18; --panel:#1e2320; --paper:#232926; --ink:#e7ebe6; --muted:#9aa49d; --line:#343b37;
  --accent:#6aa6ea; --accent-soft:#223449; --warn:#e08a55; --ok:#5fbf86;
  --grid:#2a302c; --grid-major:#353d38; --wall:#c9cfca; --glass:#4b86ad; --glass-edge:#8cc8ec; --dim:#ef7a6e; --sel:#6aa6ea; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:250px 1fr 310px;grid-template-areas:"top top top" "lib main side"}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand i{display:inline-block;width:18px;height:18px;border:2px solid var(--accent);border-radius:2px;position:relative}
.brand i:after{content:"";position:absolute;left:5px;top:-2px;width:2px;height:10px;background:var(--accent)}
.pname{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;min-width:140px;max-width:260px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--paper);outline:none}
.grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.grp button{border:0;background:transparent;padding:6px 10px;cursor:pointer;white-space:nowrap}
.grp button+button{border-left:1px solid var(--line)}
.grp button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn:focus-visible,.grp button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib{grid-area:lib;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.lib .search{padding:10px 12px;border-bottom:1px solid var(--line)}
.lib .search input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.lib .list{overflow:auto;padding:4px 10px 16px;flex:1}
.lib h4{margin:14px 2px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px;cursor:grab;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card svg{width:100%;height:38px;display:block}
.card b{font-weight:500;font-size:11.5px;line-height:1.2}
.card small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.main{grid-area:main;position:relative;min-width:0;min-height:0;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:default}
#plan.pan{cursor:grab}#plan.panning{cursor:grabbing}#plan.draw{cursor:crosshair}
#three{position:absolute;inset:0}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hud .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:8px;font-size:12px;max-width:90%;text-align:center}
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{overflow:auto;padding:12px 14px 24px;flex:1;min-height:0}
.pane h3{margin:2px 0 10px;font-size:15px}
.pane h5{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.one{grid-template-columns:1fr}
.row.four{grid-template-columns:repeat(4,1fr)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:13px;min-width:0;width:100%}
label.f input[type=number]{font-family:var(--font-mono);font-size:12px}
label.f input[type=color]{padding:2px;height:32px}
label.c{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.sw button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button:focus-visible{outline:2px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
table.ex{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.ex th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);padding:5px 4px}
table.ex td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
table.ex td.n{text-align:right;font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
table.ex tr.tot td{font-weight:700;border-bottom:0}
table.ex tr.sub td{color:var(--muted)}
table.ex tr:hover td{background:var(--accent-soft);cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-family:var(--font-mono);font-size:16px;font-weight:600}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:18px}
.dlg h3{margin:0 0 12px}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.pitem div{flex:1;min-width:0}
.pitem small{color:var(--muted);display:block}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;font-size:12.5px;z-index:30}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper)}
.chk{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.chk.red{border-color:var(--warn);color:var(--warn)} .chk.ok{color:var(--ok)}
.lvl{display:inline-block;min-width:54px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:6px;text-align:center}
.lvl.red{background:#f6dcd8;color:#a3342a} .lvl.yellow{background:#f6e8cc;color:#8a5a12} .lvl.info{background:var(--accent-soft);color:var(--accent)} .lvl.ok{background:#dcefe2;color:#2e7d4f}
.checks li{margin:6px 0;font-size:12.5px;line-height:1.4;cursor:pointer} .checks small{color:var(--muted);display:block;margin-left:62px}
.dlg.wiz{max-width:680px} .fitbar{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--paper);font-size:12.5px}
.fitbar b{font-family:var(--font-mono)} .fitbar.bad{border-color:var(--warn)} .fitbar.good{border-color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 10px}
.aibox{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0 4px;background:var(--accent-soft)}
.aibox textarea{width:100%;min-height:58px;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
/* plan styles */
.nss{vector-effect:non-scaling-stroke}
#plan text{font-family:var(--font-ui)}
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto;grid-template-areas:"top" "main" "side" "lib"}
  .lib,.side{border:0;border-top:1px solid var(--line);max-height:none}
  .lib .list{max-height:60vh}
  .pane{max-height:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>Планировщик</div>
    <input id="pname" class="pname" aria-label="Название проекта" value="Офис продаж">
    <button class="btn" id="bProjects">Проекты</button>
    <button class="btn primary" id="bWizard" title="Собрать офис продаж по вопросам">Мастер офиса</button>
    <div class="grp" role="group" aria-label="Уровень">
      <button id="lv0" class="on">1 этаж</button><button id="lv1">Антресоль</button>
    </div>
    <div class="grp" role="group" aria-label="Вид">
      <button id="v2d" class="on">План 2D</button><button id="v3d">3D</button>
    </div>
    <div class="grp" role="group" aria-label="История">
      <button id="bUndo" title="Отменить (Ctrl+Z)">↶</button><button id="bRedo" title="Повторить (Ctrl+Y)">↷</button>
    </div>
    <button class="btn" id="bFit" title="Показать всё здание">Весь план</button>
    <span class="spacer"></span>
    <span class="status" id="status">—</span>
    <button class="btn primary" id="bExport">Выгрузить</button>
  </header>

  <aside class="lib" aria-label="Библиотека">
    <div class="search"><input id="q" placeholder="Поиск: диван, кабинет, витраж…" aria-label="Поиск по библиотеке"></div>
    <div class="list" id="lib"></div>
  </aside>

  <main class="main">
    <svg id="plan" aria-label="План помещения"></svg>
    <div id="three" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="hud" id="hud"></div>
  </main>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button id="tProps" class="on">Свойства</button><button id="tEx">Экспликация</button><button id="tProj">Здание</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* KB:BEGIN */
/* Офис продаж: база знаний, генератор планировки и проверки норм.
 * Один файл для двух потребителей:
 *   - планировщик (index.html) — встраивается между маркерами KB:BEGIN / KB:END (build.py);
 *   - скилл Claude (.claude/skills/sales-office-planning/scripts) — через Node: require('./office-kb.js').
 * Координаты — метры, X вдоль дороги, Y вглубь (Y = D — витражный фасад у дороги).
 * Площади — в чистоте. Числа — ориентиры для эскиза заказчика, окончательно проверяет проектировщик.
 */
(function (root) {
  "use strict";
  const KB = { version: "1.0" };

  KB.CAT = {
    client: { n: "Клиентская зона", c: "#F3E6CF" }, office: { n: "Кабинеты продаж", c: "#DAE8F6" },
    meet: { n: "Переговорные", c: "#F7D9C2" }, back: { n: "Бэк-офис", c: "#E5DBF2" },
    staff: { n: "Помещения персонала", c: "#E0ECD8" }, service: { n: "Служебные / технические", c: "#E2E2DC" },
    wc: { n: "Санузлы", c: "#D3EEEA" }, circ: { n: "Коммуникации", c: "#EDEDE6" },
  };
  // Зоны приватности: от входа вглубь и снизу вверх
  KB.ZONES = { public: "Публичная", semi: "Полупубличная", private: "Закрытая клиентская", service: "Служебная" };

  // Размеры мебели, которую ставит генератор (w × h, м) — совпадают с каталогом планировщика
  const DIMS = {
    door9: [.9, 1.2], door18: [1.8, 1.2], slide: [1, .3], recep: [3, .8], model: [5, 3], lounge: [2.2, 2.9],
    kidtab: [1, .6], kidmat: [2, 2], led: [2, .2], plant: [.6, .6], cooler: [.35, .35], work3: [1.6, 2.3],
    deskB: [1.8, .9], chairO: [.6, .6], chairV: [.5, .5], os4: [2.8, 2.6], os1: [1.4, 1.3], cab: [.9, .45], shelf: [1, .4],
    safe: [.5, .5], desk: [1.6, .8], meet6: [2.4, 2.1], meet8: [3.2, 2.2], kitch: [2.4, .6], fridge: [.7, .7],
    dine: [1.9, 1.9], bar: [3, .6], stool: [.45, .45], wc: [.4, .7], sink: [.55, .45], cubicle: [1.2, 1.8],
    stair2: [2.6, 4], mfp: [.6, .5], sofa2: [1.6, .9], stand: [1.2, .4],
  };

  KB.DEFAULTS = {
    name: "Офис продаж", w: 40, d: 12, h: 7, M: 6, B: 6, maket: "5x3",
    kids: true, cafe: true, wardrobe: true, bank: true, cashier: false, media: false, showroom: false,
    director: true, mezz: "auto", front: "vitrage",
  };
  KB.MAKET = { "3x2": [3, 2], "5x3": [5, 3], "6x4": [6, 4] };

  /* ------------------------------------------------------------ программа помещений */
  KB.program = function (p0) {
    const p = Object.assign({}, KB.DEFAULTS, p0);
    const M = Math.max(1, Math.round(p.M)), B = Math.max(0, Math.round(p.B));
    const mk = KB.MAKET[p.maket] || KB.MAKET["5x3"];
    const seats = Math.max(6, Math.ceil(1.5 * M));
    const staff = M + B + (p.director ? 1 : 0) + 1; // + хостес
    const R = [];
    const add = (key, name, zone, cat, n, w, h, o = {}) =>
      R.push(Object.assign({ key, name, zone, cat, n, w, h, area: +(w * h).toFixed(2), border: "wall", status: "обязательно", rule: "" }, o));
    add("tambour", "Тамбур", "public", "circ", 1, 2.6, 2.5, { border: "glass", rule: "глубина по ходу ≥ 2,45 м, двери наружу (СП 59)" });
    add("reception", "Ресепшен", "public", "client", 1, 4.4, 2.4, { border: "none", sub: true, rule: "стойка 3 м, видна от входа" });
    add("lounge", "Зона ожидания", "public", "client", 1, 0, 0, { area: +(seats * 1.8).toFixed(1), border: "none", sub: true, seats, rule: `мест max(6; 1,5·M) = ${seats} × 1,8 м²` });
    add("maket", "Зона макета", "public", "client", 1, +(mk[0] + 2.4).toFixed(2), +(mk[1] + 2.4).toFixed(2), { border: "none", sub: true, rule: `стол ${mk[0]}×${mk[1]} + обход 1,2 м` });
    if (p.kids) add("kids", "Детская зона", "public", "client", 1, 3.5, 3.5, { border: "none", sub: true, status: "желательно", color: "#F4D36B", rule: "видна из зоны ожидания, не у входа" });
    if (p.cafe) add("cafe", "Кофе-поинт", "public", "client", 1, 4, 3.2, { border: "none", status: "желательно", color: "#D9B98E", rule: "мокрая точка" });
    if (p.wardrobe) add("wardrobe", "Гардероб посетителей", "public", "client", 1, 2, 3.2, { border: "wall", status: "желательно" });
    if (p.media) add("media", "Медиа / VR зона", "public", "client", 1, 4, 3, { border: "none", sub: true, status: "опция" });
    add("cabinet", "Кабинет менеджера", "semi", "office", M, 3, 3.2, { border: "glass", color: "#9EA3A6", rule: "1 на менеджера, стекло в зал" });
    add("meet", "Переговорная на 6", "semi", "meet", Math.max(1, Math.round(M * 0.2)), 4.5, 3.2, { border: "glass", rule: "max(1; 0,2·M), акустика Rw ≥ 42 дБ" });
    if (p.bank) add("bank", "Ипотека / банк-партнёр", "semi", "office", M > 12 ? 2 : 1, 3, 3.2, { border: "glass" });
    if (p.showroom) add("showroom", "Шоурум отделки", "semi", "client", 1, 5, 3.2, { border: "glass", status: "опция" });
    add("vip", "Сделочная / VIP", "private", "meet", Math.ceil(M / 6), 0, 0, { area: 22, border: "glass", color: "#A8784E", rule: "ceil(M/6), 18–25 м²" });
    if (p.cashier) add("cashier", "Касса", "private", "service", 1, 3, 3, { status: "опция", rule: "усиленная дверь, сейф; при эскроу обычно не нужна" });
    add("wcv", "С/у посетителей", "public", "wc", 1, 0, 0, { area: M >= 6 ? 8.8 : 5, color: "#CFE8E6", rule: "универсальная кабина МГН ≥ 2,20×2,25 (СП 59 табл. 6.1)" });
    add("backoffice", "Бэк-офис open-space", "service", "back", 1, 0, 0, { area: Math.max(12, B * 6), rule: `B × 6 м² (≥ 4,5 м² на место с ПК)` });
    if (p.director) add("director", "Кабинет руководителя", "service", "back", 1, 4, 4.5, { status: "желательно", color: "#A8784E", rule: "18 м² (СП 118 п. 5.31, рекомендация)" });
    add("kitchen", "Кухня / приём пищи", "service", "staff", 1, 0, 0, { area: Math.max(12, staff), rule: `1 м² на человека в смене, ≥ 12 м² (${staff} чел.)` });
    add("wcs", "С/у персонала", "service", "wc", Math.max(1, Math.ceil(staff / 15)), 1.8, 2.5, { color: "#CFE8E6" });
    add("kui", "КУИ", "service", "service", 1, 1.8, 2, { rule: "кладовая уборочного инвентаря, с водой" });
    add("elec", "Электрощитовая", "service", "service", 1, 2, 2.5, { rule: "не под мокрыми помещениями" });
    add("server", "Серверная / архив", "service", "service", 1, 2, 2.5);
    return { params: p, rows: R, seats, staff };
  };

  // Вмещается ли программа: Σ целей × k (коммуникации) против площади внутри наружных стен
  KB.fit = function (p0) {

      const occ = I.filter(i => (i.lv || 0) === 0 && (i.t === "item" || (i.t === "room" && i.name !== "Зал продаж"))).map(i => { const q = (i.rot || 0) % 180 ? [i.h, i.w] : [i.w, i.h]; return [i.x, i.y, q[0], q[1]]; });

      for (let y = y1 - 3.3; y >= yP + 0.4 && placedG < groups; y -= 0.5)
        for (let x = x0 + 0.4; x + 2.2 <= xP - 0.4 && placedG < groups; x += 0.5) {

        if (r._key === "server") I.push(furn("shelf", r.x + 0.1, r.y + 0.1, 0, Object.assign({ w: Math.min(1.8, r.w - 0.2) }, L1))); }

    const project = {

  /* ------------------------------------------------------------ программа: цель / факт */
  const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е");
  const MATCH = {
    tambour: ["тамбур"], reception: ["ресепшен", "хостес"], lounge: ["ожидан", "лаунж"], maket: ["макет"], kids: ["детск"],
    cafe: ["кофе", "бар", "кафе"], wardrobe: ["гардероб"], media: ["медиа", "vr"], cabinet: ["кабинет менеджер"], meet: ["переговорн"],
    bank: ["ипотек", "банк"], showroom: ["шоурум"], vip: ["сделочн", "vip"], cashier: ["касса"], wcv: ["с/у посетит", "с/у мгн", "санузел посетит"], stair: ["лестнич"],

    for (const r of wcv) if (Math.min(r.w, r.h) < 2.2 || Math.max(r.w, r.h) < 2.25) add("red", `«${r.name}»: меньше 2,20×2,25 м — универсальная кабина МГН не помещается.`, "СП 59.13330.2020 табл. 6.1", r.id);
    // Тамбур

    // Антресоль
    const m = R(1).filter(r => !r.sub), mA = m.reduce((s, r) => s + area(r), 0);
    if (m.length) {

      if (b.h - b.mz < 2.2) add("red", `Над антресолью ${(b.h - b.mz).toFixed(2)} м < 2,2 м.`, "СП 118.13330.2022 п. 4.26");
      if (b.mz - 0.3 < 2.2) add("red", `Под антресолью ${(b.mz - 0.3).toFixed(2)} м < 2,2 м.`, "СП 118.13330.2022 п. 4.26");

      else if (share >= 0.35) add("yellow", `Антресоль ${Math.round(share * 100)}% — близко к пределу 40%.`, "СП 118.13330.2022 п. 3.1.2");
      if (mA > 300) add("red", "Антресоль больше 300 м² — нужна вторая лестница.", "СП 1.13130.2020 п. 4.2.7");
      if (!items.some(i => i.t === "item" && /^stair/.test(i.k))) add("red", "На антресоль нет лестницы.", "СП 1.13130.2020 п. 4.4");
      for (const r of m) if (["client", "meet", "office"].includes(r.cat)) add("yellow", `«${r.name}» — клиентское помещение на антресоли: нужен подъёмник для МГН или перенос вниз.`, "СП 59.13330.2020", r.id);
      if (!items.some(i => i.t === "wall" && i.lv === 1 && i.kind === "rail")) add("yellow", "На краю антресоли нет ограждения (h ≥ 1,2 м).", "СП 118.13330.2022 п. 6.12");
    }
    // Бэк-офис: площадь на рабочее место
    const seatsOf = it => ({ os1: 1, os4: 4, work3: 1 }[it.k] || 0);
    for (const r of rooms.filter(r => has(r, "бэк-офис"))) {
      const n = items.filter(i => i.t === "item" && (i.lv || 0) === (r.lv || 0) && i.x >= r.x - .01 && i.y >= r.y - .01 && i.x <= r.x + r.w && i.y <= r.y + r.h).reduce((s, i) => s + seatsOf(i), 0);

      const kA = k.reduce((s, r) => s + area(r), 0); if (kA + 0.01 < need) add("yellow", `Кухня ${kA.toFixed(1)} м² < ${need} м² (${staff} чел. в смене).`, "СП 44.13330.2011 п. 5.51–5.52 (сверить)"); }
    // Кабинет приёма

        const ox = Math.min(a.x + a.w, c.x + c.w) - Math.max(a.x, c.x), oy = Math.min(a.y + a.h, c.y + c.h) - Math.max(a.y, c.y);
        if (ox > 0.15 && oy > 0.15) add("yellow", `«${a.name}» и «${c.name}» перекрываются.`, "геометрия", a.id); } }

    }
    const order = { red: 0, yellow: 1, info: 2 };
    return out.sort((a, c) => order[a.level] - order[c.level]);
  };

  /* ------------------------------------------------------------ текстовая сводка (для Claude и CLI) */
  KB.summary = function (S) {
    const rooms = (S.items || []).filter(i => i.t === "room" && !i.sub);
    const a0 = rooms.filter(r => !r.lv).reduce((s, r) => s + r.w * r.h, 0), a1 = rooms.filter(r => r.lv === 1).reduce((s, r) => s + r.w * r.h, 0);
    const lines = [`${S.name}: здание ${S.b.w}×${S.b.d}×${S.b.h} м, 1 этаж ${a0.toFixed(1)} м², антресоль ${a1.toFixed(1)} м²`];

const fmt = (v,d=2) => (Math.round(v*10**d)/10**d).toFixed(d).replace(".",",");
const m2 = v => fmt(v,1);
const byId = id => S.items.find(i=>i.id===id);
const snap = v => snapOn ? Math.round(v/grid)*grid : v;
const aabb = it => { if(it.t!=="item") return {x:it.x,y:it.y,w:it.w,h:it.h};
  const q=(it.rot||0)%180!==0; return {x:it.x,y:it.y,w:q?it.h:it.w,h:q?it.w:it.h}; };
const hx = (c,a) => { const n=parseInt(c.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
function wallH(kind){ const h=WALLS[kind].h; return h==="H" ? S.b.h : h; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

function pushUndo(){ undo.push(JSON.stringify(S)); if(undo.length>120) undo.shift(); redo.length=0; }
function commit(){ hasUserEdit = true; dirty = true; render(); scheduleSave(); }
function doUndo(){ if(!undo.length) return; redo.push(JSON.stringify(S)); S=JSON.parse(undo.pop()); if(sel&&!byId(sel)) sel=null; commit(); }
function doRedo(){ if(!redo.length) return; undo.push(JSON.stringify(S)); S=JSON.parse(redo.pop()); if(sel&&!byId(sel)) sel=null; commit(); }

/* ============================================================ символы мебели (локальные координаты 0..w, 0..h) */
function sym(it, forCard){
  const f=FK[it.k]||{d:"rect"}, w=it.w, h=it.h, k="class='nss'";
  const st = "fill='var(--paper)' stroke='var(--ink)' stroke-width='0.8' "+k;
  const lt = "fill='none' stroke='var(--ink)' stroke-width='0.5' "+k;
  const R=(x,y,ww,hh,extra="")=>`<rect x='${x}' y='${y}' width='${Math.max(ww,0)}' height='${Math.max(hh,0)}' ${extra||st}/>`;
  const chair=(cx,cy,a=.45,dir=0)=>`<g transform='translate(${cx} ${cy}) rotate(${dir})'>${R(-a/2,-a/2,a,a)}${R(-a/2,-a/2,a,a*.2,"fill='var(--ink)' opacity='.55'")}</g>`;
  switch(f.d){
    case "door": { const lf=w, b=Math.min(.3,h);
      return `${R(0,0,w,b,"fill='var(--paper)' stroke='none'")}<line x1='0' y1='${b}' x2='0' y2='${b+lf}' stroke='var(--ink)' stroke-width='1.6' ${k}/><path d='M ${lf} ${b} A ${lf} ${lf} 0 0 1 0 ${b+lf}' ${lt}/>`; }
    case "door2": { const lf=w/2, b=.3;
      return `${R(0,0,w,b,"fill='var(--paper)' stroke='none'")}<line x1='0' y1='${b}' x2='0' y2='${b+lf}' stroke='var(--ink)' stroke-width='1.6' ${k}/><line x1='${w}' y1='${b}' x2='${w}' y2='${b+lf}' stroke='var(--ink)' stroke-width='1.6' ${k}/><path d='M ${lf} ${b} A ${lf} ${lf} 0 0 1 0 ${b+lf}' ${lt}/><path d='M ${lf} ${b} A ${lf} ${lf} 0 0 0 ${w} ${b+lf}' ${lt}/>`; }
    case "slide": return `${R(0,0,w,h,"fill='var(--paper)' stroke='none'")}${R(-.05,h*.55,w*.6,.06)}<line x1='${w*.2}' y1='${h*.85}' x2='${w*.8}' y2='${h*.85}' ${lt}/>`;
    case "auto": return `${R(0,0,w,h,"fill='var(--paper)' stroke='none'")}${R(0,h*.5,w*.48,.06)}${R(w*.52,h*.5,w*.48,.06)}<path d='M ${w*.3} ${h*.2} L ${w*.1} ${h*.2} M ${w*.7} ${h*.2} L ${w*.9} ${h*.2}' ${lt}/>`;
    case "win": return `${R(0,0,w,h,"fill='var(--glass)' stroke='var(--glass-edge)' stroke-width='.6' "+k)}<line x1='0' y1='${h/2}' x2='${w}' y2='${h/2}' stroke='var(--glass-edge)' stroke-width='.5' ${k}/>`;
    case "chair": return chair(w/2,h/2,Math.min(w,h));
    case "stool": return `<circle cx='${w/2}' cy='${h/2}' r='${Math.min(w,h)/2}' ${st}/>`;
    case "arm": return `${R(0,0,w,h)}${R(0,0,w,h*.22,"fill='var(--ink)' opacity='.3'")}${R(0,0,w*.15,h)}${R(w*.85,0,w*.15,h)}`;

function itemTf(it){ const a=aabb(it), r=it.rot||0;

/* ============================================================ разметка плана (строка SVG, единицы — метры) */
function numbering(){
  const map={}; for(const lv of [0,1]){ let n=1;
    S.items.filter(i=>i.t==="room"&&i.lv===lv&&!i.sub).sort((a,b)=>(a.y-b.y)||(a.x-b.x)).forEach(r=>map[r.id]=(lv?"А":"")+(n++)); }
  return map;
}
function wallRect(wl){ const dx=wl.x2-wl.x1, dy=wl.y2-wl.y1, L=Math.hypot(dx,dy)||1e-6, nx=-dy/L*wl.th/2, ny=dx/L*wl.th/2;
  return `${wl.x1+nx},${wl.y1+ny} ${wl.x2+nx},${wl.y2+ny} ${wl.x2-nx},${wl.y2-ny} ${wl.x1-nx},${wl.y1-ny}`; }
function drawWall(wl, ghost, interactive){
  const W=WALLS[wl.kind]; const pts=wallRect(wl);
  if(ghost) return `<polygon points='${pts}' fill='none' stroke='var(--muted)' stroke-width='.6' opacity='.5' class='nss'/>`;
  let s = W.glass
    ? `<polygon points='${pts}' fill='var(--glass)' stroke='var(--glass-edge)' stroke-width='.7' class='nss'/><line x1='${wl.x1}' y1='${wl.y1}' x2='${wl.x2}' y2='${wl.y2}' stroke='var(--glass-edge)' stroke-width='.6' class='nss' ${wl.kind==="rail"?"stroke-dasharray='4 2'":""}/>`
    : `<polygon points='${pts}' fill='${wl.kind==="part"?"var(--paper)":"var(--wall)"}' stroke='var(--wall)' stroke-width='.8' class='nss'/>`;
  if(interactive) s += `<line x1='${wl.x1}' y1='${wl.y1}' x2='${wl.x2}' y2='${wl.y2}' stroke='transparent' stroke-width='12' class='nss' data-id='${wl.id}' style='cursor:move'/>`;
  return s;
}
function planMarkup(lv, opt={}){
  const {b}=S, nums=numbering(), out=[], exp=!!opt.export;
  const mine = S.items.filter(i=>i.lv===lv), other = S.items.filter(i=>i.lv!==lv);
  out.push(`<rect x='0' y='0' width='${b.w}' height='${b.d}' fill='${exp?"#fff":"var(--paper)"}' stroke='none'/>`);
  if(lv===1 && !exp) out.push(`<rect x='0' y='0' width='${b.w}' height='${b.d}' fill='url(#hatch)' opacity='.6'/>`);
  // призрак другого уровня
  if(!exp || lv===1) for(const it of other){
    if(it.t==="room") out.push(`<rect x='${it.x}' y='${it.y}' width='${it.w}' height='${it.h}' fill='none' stroke='var(--muted)' stroke-width='.6' stroke-dasharray='3 3' opacity='.55' class='nss'/>`);
    else if(it.t==="wall") out.push(drawWall(it,true));
    else if(lv===1) out.push(`<g transform='${itemTf(it)}' opacity='.18'>${sym(it)}</g>`);
  }
  const rooms = mine.filter(i=>i.t==="room");
  const ordered = [...rooms.filter(r=>!r.sub), ...rooms.filter(r=>r.sub)];
  for(const r of ordered){
    out.push(`<rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='${r.sub?hx(r.color,.55):r.color}' ${r.sub?"stroke='#8a7d62' stroke-width='.8' stroke-dasharray='5 3' class='nss'":"stroke='none'"} ${exp?"":`data-id='${r.id}' style='cursor:move'`}/>`);
  }
  for(const r of rooms){ if(r.border==="none"||r.sub) continue;
    if(r.border==="wall") out.push(`<rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='none' stroke='var(--wall)' stroke-width='.12' pointer-events='none'/>`);
    else out.push(`<rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='none' stroke='var(--glass-edge)' stroke-width='.09' pointer-events='none'/><rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='none' stroke='var(--glass)' stroke-width='.04' pointer-events='none'/>`);
  }
  for(const wl of mine.filter(i=>i.t==="wall")) out.push(drawWall(wl,false,!exp));
  for(const it of mine.filter(i=>i.t==="item")){
    const lbl = it.label ? `<text x='${aabb(it).x+aabb(it).w/2}' y='${aabb(it).y+aabb(it).h+.28}' font-size='.22' text-anchor='middle' fill='var(--muted)' pointer-events='none'>${esc(it.label)}</text>`:"";
    out.push(`<g transform='${itemTf(it)}' ${exp?"":`data-id='${it.id}' style='cursor:move'`}>${sym(it)}<rect x='0' y='0' width='${it.w}' height='${it.h}' fill='transparent' stroke='none'/></g>${lbl}`);
  }
  // наружные стены здания
  const t=.3, fr=b.front;
  out.push(`<g pointer-events='none'>`);
  out.push(`<rect x='0' y='0' width='${b.w}' height='${t}' fill='var(--wall)'/><rect x='0' y='0' width='${t}' height='${b.d}' fill='var(--wall)'/><rect x='${b.w-t}' y='0' width='${t}' height='${b.d}' fill='var(--wall)'/>`);
  if(fr==="vitrage"){ out.push(`<rect x='${t}' y='${b.d-t}' width='${b.w-2*t}' height='${t}' fill='var(--glass)' stroke='var(--glass-edge)' stroke-width='.6' class='nss'/><line x1='${t}' y1='${b.d-t/2}' x2='${b.w-t}' y2='${b.d-t/2}' stroke='var(--glass-edge)' stroke-width='.6' class='nss'/>`);
    for(let x=0;x<=b.w+1e-6;x+=5){ const cx=Math.min(Math.max(x,.2),b.w-.2); out.push(`<rect x='${cx-.2}' y='${b.d-.4}' width='.4' height='.4' fill='var(--wall)'/>`); } }
  else out.push(`<rect x='0' y='${b.d-t}' width='${b.w}' height='${t}' fill='var(--wall)'/>`);
  out.push(`</g>`);
  // подписи помещений
  for(const r of ordered){
    const fs = Math.max(.16, Math.min(.34, r.w/12, r.h/5));
    const cx=r.x+r.w/2, cy=r.y+r.h/2, num=nums[r.id];
    const area = r.w*r.h;
    const name = r.sub ? r.name : `${num}. ${r.name}`;
    const words = wrapText(name, r.w, fs);
    const lines = [...words, `${m2(area)} м²`];
    const y0 = cy - (lines.length-1)*fs*1.2/2;
    out.push(`<text font-size='${fs}' text-anchor='middle' fill='${exp?"#222":"var(--ink)"}' pointer-events='none' style='paint-order:stroke;stroke:${hx(r.color,.8)};stroke-width:${fs*.25}px'>`+
      lines.map((l,i)=>`<tspan x='${cx}' y='${y0+i*fs*1.2}' dominant-baseline='central' ${i===lines.length-1?"font-weight='600'":""}>${esc(l)}</tspan>`).join("")+`</text>`);
  }
  return out.join("");
}
function wrapText(s, w, fs){ const max=Math.max(6, Math.floor(w/(fs*.55))); const words=s.split(" "); const lines=[]; let cur="";
  for(const wd of words){ if((cur+" "+wd).trim().length>max && cur){ lines.push(cur); cur=wd; } else cur=(cur+" "+wd).trim(); }
  if(cur) lines.push(cur); return lines.slice(0,3); }

/* ============================================================ размерные линии */
function dimLine(x1,y1,x2,y2,label,off=0){
  const s=V.s, ang=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(ang), ny=Math.cos(ang);
  const ox=nx*off, oy=ny*off, a=[x1+ox,y1+oy], b=[x2+ox,y2+oy], tk=6/s;
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2; let deg=ang*180/Math.PI; if(deg>90||deg<-90) deg+=180;
  const fs=12/s;
  return `<g pointer-events='none'><line x1='${a[0]}' y1='${a[1]}' x2='${b[0]}' y2='${b[1]}' stroke='var(--dim)' stroke-width='1' class='nss'/>`+
    [a,b].map(p=>`<line x1='${p[0]-tk}' y1='${p[1]+tk}' x2='${p[0]+tk}' y2='${p[1]-tk}' stroke='var(--dim)' stroke-width='1.4' class='nss'/>`).join("")+
    (off?`<line x1='${x1}' y1='${y1}' x2='${a[0]}' y2='${a[1]}' stroke='var(--dim)' stroke-width='.5' class='nss'/><line x1='${x2}' y1='${y2}' x2='${b[0]}' y2='${b[1]}' stroke='var(--dim)' stroke-width='.5' class='nss'/>`:"")+
    `<text x='${mx}' y='${my}' transform='rotate(${deg} ${mx} ${my}) translate(0 ${-5/s})' font-size='${fs}' text-anchor='middle' fill='var(--dim)' style='font-family:var(--font-mono);paint-order:stroke;stroke:var(--paper);stroke-width:${3/s}px'>${label}</text></g>`;
}
const mm = v => String(Math.round(v*1000)).replace(/\B(?=(\d{3})+(?!\d))/g," ");

const svg = $("#plan");
let drag = null, guides = [], drawPreview = null;
function render(){

function renderPlan(){

  <pattern id='g5' width='5' height='5' patternUnits='userSpaceOnUse'><rect width='5' height='5' fill='url(#g1)'/><path d='M5 0 H0 V5' fill='none' stroke='var(--grid-major)' stroke-width='${1/s}'/></pattern>
  <pattern id='hatch' width='.6' height='.6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='.6' stroke='var(--grid-major)' stroke-width='${1/s}'/></pattern></defs>`;

  o += `<rect x='-3' y='${b.d+1.6}' width='${b.w+6}' height='3.2' fill='var(--grid-major)' opacity='.6' pointer-events='none'/><text x='${b.w/2}' y='${b.d+3.2}' font-size='.5' text-anchor='middle' dominant-baseline='central' fill='var(--muted)' pointer-events='none' letter-spacing='.2'>ДОРОГА · ФАСАД</text>`;
  o += planMarkup(level);

  o += dimLine(0,0,b.w,0,mm(b.w),-1.1) + dimLine(0,b.d,0,0,mm(b.d),-1.1);
  // оси колонн при витраже
  // выделение
  const it = sel && byId(sel);
  if(it && it.lv===level){
    if(it.t==="wall"){
      const L=Math.hypot(it.x2-it.x1,it.y2-it.y1);
      o += dimLine(it.x1,it.y1,it.x2,it.y2,mm(L), .6);
      o += [[it.x1,it.y1,0],[it.x2,it.y2,1]].map(p=>`<circle cx='${p[0]}' cy='${p[1]}' r='${6/s}' fill='var(--paper)' stroke='var(--sel)' stroke-width='2' class='nss' data-wp='${p[2]}' style='cursor:crosshair'/>`).join("");
    } else {
      const a=aabb(it);
      o += `<rect x='${a.x}' y='${a.y}' width='${a.w}' height='${a.h}' fill='none' stroke='var(--sel)' stroke-width='1.5' stroke-dasharray='5 3' class='nss' pointer-events='none'/>`;
      o += dimLine(a.x,a.y,a.x+a.w,a.y,mm(a.w),-.45) + dimLine(a.x,a.y+a.h,a.x,a.y,mm(a.h),-.45);
      if(drag && (drag.mode==="move"||drag.mode==="resize")) o += clearances(a);
      const hs=[["nw",0,0],["n",.5,0],["ne",1,0],["e",1,.5],["se",1,1],["s",.5,1],["sw",0,1],["w",0,.5]];
      const cur={nw:"nwse",se:"nwse",ne:"nesw",sw:"nesw",n:"ns",s:"ns",e:"ew",w:"ew"};
      const fixed = it.t==="item" && FIXH[FK[it.k]?.d];
      for(const [h,fx,fy] of hs){ if(fixed && (h!=="e"&&h!=="w") && ((it.rot||0)%180===0)) continue; if(fixed && (h!=="n"&&h!=="s") && ((it.rot||0)%180!==0)) continue;
        const px=a.x+a.w*fx, py=a.y+a.h*fy, z=5/s;
        o += `<rect x='${px-z}' y='${py-z}' width='${2*z}' height='${2*z}' fill='var(--paper)' stroke='var(--sel)' stroke-width='1.6' class='nss' data-h='${h}' style='cursor:${cur[h]}-resize'/>`; }
    }
  }

    for(const wl of S.items.filter(i=>i.t==="wall"&&i.lv===lv)){ const W=WALLS[wl.kind], L=Math.hypot(wl.x2-wl.x1,wl.y2-wl.y1), hh=W.h==="H"?H-base:W.h;

    case "work3": part(W,.04,.8,0,.74,-D/2+1.05,f.c); part(W*.9,.7,.05,0,.36,-D/2+.7,"#999"); part(.55,.5,.55,0,.25,-D/2+.3,"#3c4146"); part(.45,.45,.45,-.4,.225,D/2-.25,"#6b7075"); part(.45,.45,.45,.4,.225,D/2-.25,"#6b7075"); break;
    case "os1": part(W,.04,.7,0,.74,-D/2+.35,f.c); part(.55,.5,.55,0,.25,D/2-.3,"#3c4146"); part(.6,.4,.03,0,.95,-D/2+.1,"#222"); break;
    case "os4": part(W,.04,1.4,0,.74,0,f.c); part(W,.35,.03,0,.95,0,"#b9c7cf"); for(const x of [-W/4,W/4]){ part(.5,.5,.5,x,.25,-D/2+.3,"#3c4146"); part(.5,.5,.5,x,.25,D/2-.3,"#3c4146"); } break;

/* ============================================================ сохранение (db или браузер) */
const statusEl=$("#status"); let saveTimer=null;
function setStatus(s){ statusEl.textContent=s; }
function scheduleSave(){ clearTimeout(saveTimer); setStatus("Изменения…"); saveTimer=setTimeout(saveNow,1200); }
async function saveNow(){
  if(!projectId) projectId=uid(); const rec={name:S.name, updatedAt:Date.now(), json:JSON.stringify(S)};
  try{ if(store){ await store.collection("projects").doc(projectId).set(rec); setStatus("Сохранено в проекте · "+new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})); dirty=false; return; } }catch(e){ setStatus("Не удалось сохранить: "+(e.code||e.message)+" · копия в браузере"); }
  try{ const all=JSON.parse(localStorage.getItem("op.projects")||"{}"); all[projectId]=rec; localStorage.setItem("op.projects",JSON.stringify(all)); if(!store) setStatus("Сохранено в этом браузере"); dirty=false; }catch(e){ if(!store) setStatus("Не сохранено — выгрузите файл проекта"); }
}
async function listProjects(){
  const out=[]; try{ if(store){ const q=await store.collection("projects").get(); for(const d of q.docs){ const v=d.data(); out.push({id:d.id,name:v.name,updatedAt:v.updatedAt,json:v.json,src:"db"}); } } }catch(e){}
  try{ const all=JSON.parse(localStorage.getItem("op.projects")||"{}"); for(const [id,v] of Object.entries(all)) if(!out.find(o=>o.id===id)) out.push({id,...v,src:"local"}); }catch(e){}
  return out.sort((a,b)=>b.updatedAt-a.updatedAt);
}
async function deleteProject(p){ try{ if(p.src==="db"&&store) await store.collection("projects").doc(p.id).delete(); }catch(e){}
  try{ const all=JSON.parse(localStorage.getItem("op.projects")||"{}"); delete all[p.id]; localStorage.setItem("op.projects",JSON.stringify(all)); }catch(e){} }
function openProject(json,id){ S=JSON.parse(json); if(!S.b||!S.items) throw new Error("bad"); projectId=id; sel=null; level=0; undo.length=0; redo.length=0; setView("2d"); fit(); render(); }
async function projectsDialog(){

  <div class="plist">${list.map((p,i)=>`<div class="pitem"><div><b>${esc(p.name)}</b><small>${new Date(p.updatedAt).toLocaleString("ru")}${p.id===projectId?" · открыт":""}</small></div><button class="btn" data-open="${i}">Открыть</button><button class="btn danger" data-del="${i}">Удалить</button></div>`).join("")||`<p class="note">Пока нет сохранённых проектов.</p>`}</div>
  <h5>Создать новый</h5>

  <div class="actions"><button class="btn" id="nTpl">Пример: офис продаж 40×12 с антресолью</button><button class="btn" id="nImp">Открыть файл…</button><span class="spacer"></span><button class="btn" id="nClose">Закрыть</button></div>
  <p class="note" id="nConfirm" hidden></p></div>`;
  document.body.appendChild(m); const close=()=>m.remove();
  m.addEventListener("click",async e=>{ if(e.target===m) return close(); const t=e.target;
    if(t.id==="nClose") close();
    if(t.dataset.open){ const p=list[+t.dataset.open]; try{ openProject(p.json,p.id); close(); }catch(err){ toast("Файл проекта повреждён"); } }
    if(t.dataset.del){ const i=+t.dataset.del; if(t.dataset.sure){ await deleteProject(list[i]); close(); projectsDialog(); } else { t.dataset.sure="1"; t.textContent="Точно удалить?"; } }
    if(t.id==="nNew"){ await flush(); S=blankProject(+$("#nW").value||40,+$("#nD").value||12,+$("#nH").value||7); projectId=uid(); sel=null; level=0; undo.length=0; setView("2d"); fit(); commit(); close(); }

async function flush(){ if(dirty){ clearTimeout(saveTimer); await saveNow(); } }
$("#bProjects").onclick=async()=>{ await flush(); projectsDialog(); };

let downloads=null, sampleCap=null;
function exportSVG(){
  const b=S.b, pad=2.5, gap=4, lvls=S.items.some(i=>i.lv===1)?[0,1]:[0];
  const planH=b.d+pad*2, W=b.w+pad*2+14; let y=pad+1.2, body="";
  const css=`<style>:root{--paper:#fff;--ink:#222;--muted:#777;--wall:#3a3f3b;--glass:#9fd3f0;--glass-edge:#2a78b8;--dim:#b3392f;--grid:#eee;--grid-major:#ddd}.nss{vector-effect:non-scaling-stroke}text{font-family:Arial,sans-serif}</style>`;
  const title=`<text x='${pad}' y='1.3' font-size='.7' font-weight='700'>${esc(S.name)} — ${fmt(b.w,1)} × ${fmt(b.d,1)} м</text>`;
  for(const lv of lvls){ body+=`<text x='${pad}' y='${y}' font-size='.45' font-weight='700'>${lv?"План антресоли, отм. +"+fmt(b.mz,3):"План 1-го этажа, отм. 0,000"}</text>`;
    body+=`<g transform='translate(${pad} ${y+.8})'>${planMarkup(lv,{export:true})}</g>`;
    // экспликация справа
    const g=explRows()[lv]; let ty=y+.9; body+=`<text x='${b.w+pad+.8}' y='${ty}' font-size='.32' font-weight='700'>Экспликация</text>`;
    for(const r of g.rooms){ ty+=.42; body+=`<text x='${b.w+pad+.8}' y='${ty}' font-size='.27'>${r.num} ${esc(r.name.slice(0,34))}</text><text x='${W-.5}' y='${ty}' font-size='.27' text-anchor='end'>${m2(r.area)}</text>`; }
    y+=planH+gap; }
  const H=y; const s=`<svg xmlns='http://www.w3.org/2000/svg' width='${W*10}mm' height='${H*10}mm' viewBox='0 0 ${W} ${H}'>${css}<rect width='${W}' height='${H}' fill='#fff'/>${title}${body}<text x='${pad}' y='${H-.6}' font-size='.28' fill='#777'>Масштаб 1:100 при печати в натуральную величину. Подготовлено в «Планировщике офиса продаж».</text></svg>`;
  return s;
}
function briefHTML(){
  const svgStr=exportSVG().replace(/width='[\d.]+mm' height='[\d.]+mm'/,"width='100%'"); const rows=explRows(); const fs=furnSpec(); const bA=S.b.w*S.b.d;
  const tab=g=>`<table><tr><th>№</th><th>Помещение</th><th>Размеры, м</th><th>Категория</th><th>Площадь, м²</th></tr>${g.rooms.map(r=>`<tr${r.sub?" style='color:#777'":""}><td>${r.num}</td><td>${esc(r.name)}${r.sub?" (в составе)":""}</td><td>${r.dims}</td><td>${CAT[r.cat].n}</td><td align='right'>${m2(r.area)}</td></tr>`).join("")}<tr><td></td><td><b>Итого</b></td><td></td><td></td><td align='right'><b>${m2(g.rooms.filter(r=>!r.sub).reduce((s,r)=>s+r.area,0))}</b></td></tr></table>`;

function csv(){ const rows=[["Уровень","№","Помещение","Категория","Ширина, м","Глубина, м","Площадь, м²","В составе другого"]];
  for(const g of explRows()) for(const r of g.rooms){ const it=byId(r.id); rows.push([g.lv?"Антресоль":"1 этаж",r.num,r.name,CAT[r.cat].n,fmt(it.w),fmt(it.h),fmt(r.area),r.sub?"да":""]); }
  return "﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n"); }
async function doExport(kind){
  const base=(S.name||"проект").replace(/[\\/:*?"<>|]+/g," ").trim();
  let data, filename;
  if(kind==="json"){ data=JSON.stringify(S,null,1); filename=base+".json"; }
  else if(kind==="svg"){ data=exportSVG(); filename=base+" — план.svg"; }
  else if(kind==="csv"){ data=csv(); filename=base+" — экспликация.csv"; }
  else if(kind==="brief"){ data=briefHTML(); filename=base+" — задание проектировщику.html"; }
  else if(kind==="png"){ if(!R3) return; draw3D(); data=await new Promise(r=>R3.renderer.domElement.toBlob(r,"image/png")); filename=base+" — 3D.png"; }
  if(!downloads){ // локальный запуск: обычное скачивание браузером
    const blob = data instanceof Blob ? data : new Blob([data],{type:filename.endsWith(".html")?"text/html":filename.endsWith(".svg")?"image/svg+xml":filename.endsWith(".csv")?"text/csv":"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.style.display="none"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); toast("Файл сохранён: "+filename); return; }
  try{ await downloads.save({filename,data}); toast("Файл передан на сохранение"); }catch(e){ if(e.code!=="declined") toast("Не удалось выгрузить: "+(e.message||e.code)); }
}
$("#bExport").onclick=()=>{ const m=document.createElement("div"); m.className="modal";

function checksChip(){ const c=OfficeKB.checks(S), r=c.filter(x=>x.level==="red").length, y=c.filter(x=>x.level==="yellow").length;
  return `<button class="chk ${r?"red":(y?"":"ok")}" id="hudChecks" title="Открыть проверки">${r||y?`Проверки: ${r} красн. · ${y} жёлт.`:"Проверки: замечаний нет"}</button>`; }
$("#hud").addEventListener("click",e=>{ if(e.target.id==="hudChecks"){ tab="ex"; setTabs(); renderPane(); } });
function checksHTML(){ const c=OfficeKB.checks(S);
  if(!c.length) return `<h5>Проверки</h5><p class="note"><span class="lvl ok">ок</span>Замечаний нет. Нормы — подсказка; окончательно проверяет проектировщик.</p>`;
  return `<h5>Проверки · ${c.length}</h5><ul class="checks" style="list-style:none;padding:0">`+c.map(x=>`<li ${x.id?`data-sel="${x.id}"`:""}><span class="lvl ${x.level}">${LV[x.level]}</span>${esc(x.text)}<small>${esc(x.ref)}</small></li>`).join("")+`</ul><p class="note">Правила — подсказки со ссылками на СП; окончательно проверяет проектировщик.</p>`; }
function programHTML(){ if(!S.program||!S.program.length) return `<h5>Программа помещений</h5><p class="note">Программы нет. Нажмите «Мастер офиса» — он соберёт список помещений с целевыми площадями и разложит их по зонам.</p>`;
  const f=OfficeKB.programFact(S), st={ok:"ok",yellow:"yellow",red:"red"}, nm={ok:"есть",yellow:"частично",red:"нет"};
  return `<h5>Программа: цель / факт</h5><table class="ex"><tr><th>Помещение</th><th style="text-align:right">шт.</th><th style="text-align:right">м² факт / цель</th></tr>`+
    f.map(r=>`<tr title="${esc(r.rule||"")}"><td><span class="lvl ${st[r.state]}">${nm[r.state]}</span>${esc(r.name)}</td><td class="n">${r.placed}/${r.n}</td><td class="n">${m2(r.factArea)} / ${m2(r.targetArea)}</td></tr>`).join("")+`</table>`; }
function wizardDialog(){
  const P=Object.assign({},OfficeKB.DEFAULTS,(S.meta&&S.meta.params)||{},{w:S.b.w,d:S.b.d,h:S.b.h});
  const m=document.createElement("div"); m.className="modal";
  const ck=(id,l)=>`<label class="c"><input type="checkbox" id="w_${id}" ${P[id]?"checked":""}> ${l}</label>`;
  m.innerHTML=`<div class="dlg wiz" role="dialog" aria-label="Мастер офиса продаж"><h3>Мастер офиса продаж</h3>
  <p class="note">Ответьте на вопросы: мастер соберёт программу помещений по правилам офиса продаж и разложит её по зонам — публичная у витража, кабинеты вдоль глухой стены, служебный блок и антресоль в торце. Дальше всё правится мышкой.</p>
  ${sampleCap?`<div class="aibox"><label class="f" for="w_ai">Опишите офис словами — ИИ заполнит поля
  <textarea id="w_ai" placeholder="Например: помещение 32 на 14 метров, потолок 6,5, восемь менеджеров, бэк-офис на 5 человек, нужна касса и детская, без гардероба"></textarea></label>
  <div class="actions"><button class="btn" id="w_aiGo">Заполнить по описанию</button><span class="note" id="w_aiSt"></span></div></div>`:""}
  <h5>Здание</h5><div class="row four">
  <label class="f">Длина вдоль дороги, м<input id="w_w" type="number" step=".5" value="${P.w}"></label><label class="f">Глубина, м<input id="w_d" type="number" step=".5" value="${P.d}"></label>
  <label class="f">Высота, м<input id="w_h" type="number" step=".1" value="${P.h}"></label><label class="f">Антресоль<select id="w_mezz"><option value="auto" ${P.mezz==="auto"?"selected":""}>Если высота ≥ 6,2 м</option><option value="yes" ${P.mezz==="yes"?"selected":""}>Да</option><option value="no" ${P.mezz==="no"?"selected":""}>Нет</option></select></label></div>
  <h5>Команда и макет</h5><div class="row four">
  <label class="f">Менеджеров на смене<input id="w_M" type="number" min="1" max="40" value="${P.M}"></label><label class="f">Бэк-офис, чел.<input id="w_B" type="number" min="0" max="60" value="${P.B}"></label>
  <label class="f">Стол макета<select id="w_maket">${Object.keys(OfficeKB.MAKET).map(k=>`<option ${P.maket===k?"selected":""}>${k}</option>`).join("")}</select></label>
  <label class="f">Название<input id="w_name" value="${esc(P.name||"Офис продаж")}"></label></div>
  <h5>Что нужно</h5><div class="opts">${ck("kids","Детская зона")}${ck("cafe","Кофе-поинт")}${ck("wardrobe","Гардероб посетителей")}${ck("bank","Ипотека / банк-партнёр")}${ck("cashier","Касса (при эскроу обычно не нужна)")}${ck("director","Кабинет руководителя")}${ck("media","Медиа / VR зона")}${ck("showroom","Шоурум отделки")}</div>
  <div class="fitbar" id="w_fit"></div>
  <details><summary style="cursor:pointer;font-size:12.5px">Программа помещений (что будет создано)</summary><div id="w_prog"></div></details>
  <div class="actions"><button class="btn primary" id="w_go">Создать план</button><button class="btn" id="w_cancel">Отмена</button><span class="note">Текущий проект сохранится в «Проекты».</span></div></div>`;
  document.body.appendChild(m);
  const read=()=>{ const g=id=>m.querySelector("#w_"+id), num=id=>+String(g(id).value).replace(",",".");
    return {name:g("name").value||"Офис продаж", w:num("w"), d:num("d"), h:num("h"), M:num("M"), B:num("B"), maket:g("maket").value, mezz:g("mezz").value,
      kids:g("kids").checked, cafe:g("cafe").checked, wardrobe:g("wardrobe").checked, bank:g("bank").checked, cashier:g("cashier").checked, director:g("director").checked, media:g("media").checked, showroom:g("showroom").checked}; };
  const upd=()=>{ const p=read(); if(!(p.w>4&&p.d>4&&p.h>2&&p.M>=1)) return; const f=OfficeKB.fit(p), pr=OfficeKB.program(p);
    const el=m.querySelector("#w_fit"); el.className="fitbar "+(f.ratio>=1?"good":"bad");
    el.innerHTML=`Нужно ≈ <b>${f.need} м²</b> (${f.net} м² помещений × ${String(f.k).replace(".",",")} на проходы и зал) · есть <b>${f.have} м²</b>${f.mezz?" с антресолью":""} → ${f.ratio>=1?`<b style="color:var(--ok)">помещается, запас ${Math.round((f.ratio-1)*100)}%</b>`:`<b style="color:var(--warn)">не хватает ${Math.round((1-f.ratio)*100)}%</b> — уменьшите программу или увеличьте здание`}`;
    const g=OfficeKB.generate(p); el.innerHTML+=g.warnings.length?`<div style="margin-top:6px;color:var(--warn)">Черновик раскладки: ${g.warnings.map(esc).join(" ")}</div>`:`<div style="margin-top:6px;color:var(--ok)">Черновик раскладки: всё помещается.</div>`;
    m.querySelector("#w_prog").innerHTML=`<table class="ex">`+pr.rows.map(r=>`<tr title="${esc(r.rule)}"><td>${esc(r.name)}${r.sub?" <small>(зона в зале)</small>":""}</td><td class="n">${r.n} шт.</td><td class="n">${m2(r.n*r.area)} м²</td></tr>`).join("")+`</table>`; };
  m.addEventListener("input",upd); m.addEventListener("change",upd); upd();
  m.addEventListener("click",async e=>{ const t=e.target;
    if(t===m||t.id==="w_cancel") m.remove();
    if(t.id==="w_go"){ const p=read(); await flush(); pushUndo(); const r=OfficeKB.generate(p); S=r.project; projectId=uid(); sel=null; level=0; redo.length=0;
      m.remove(); setView("2d"); fit(); commit(); tab="ex"; setTabs(); renderPane();
      toast(r.warnings.length?`План собран. Замечаний: ${r.warnings.length} — см. «Экспликация»`:"План собран по программе"); }
    if(t.id==="w_aiGo"){ const txt=m.querySelector("#w_ai").value.trim(); const st=m.querySelector("#w_aiSt"); if(!txt){ st.textContent="Напишите пару фраз об офисе."; return; }
      st.textContent="Разбираю описание…"; t.disabled=true;
      try{ const res=await sampleCap.json(`Ты помогаешь заполнить мастер планировки офиса продаж девелопера. Переведи описание пользователя в параметры генератора.
Верни ТОЛЬКО JSON-объект вида ${OfficeKB.PARAM_SCHEMA_TEXT}. Включай только поля, о которых есть сведения в описании; числа в метрах и людях. «Эскроу», «без кассы» → cashier:false. «Двусветный зал», «второй ярус», «антресоль» → mezz:"yes".
Описание: """${txt}"""`,{modelTier:"quick"});
        const map={w:"w",d:"d",h:"h",M:"M",B:"B",name:"name",maket:"maket",mezz:"mezz"}; let n=0;
        for(const [k,v] of Object.entries(res||{})){ const el=m.querySelector("#w_"+k); if(!el) continue; if(el.type==="checkbox") el.checked=!!v; else el.value=v; n++; }
        upd(); st.textContent=n?`Заполнено полей: ${n}. Проверьте и нажмите «Создать план».`:"Не удалось понять описание — заполните поля вручную."; }
      catch(err){ st.textContent=err&&err.code==="not_granted"?"ИИ недоступен в этом просмотре.":"Не получилось разобрать описание, заполните поля вручную."; }
      t.disabled=false; } });
}
$("#bWizard").onclick=()=>wizardDialog();

/* ============================================================ запуск */
S = OfficeKB.generate({name:"Офис продаж 40×12 (пример)"}).project;
try{ const last=JSON.parse(localStorage.getItem("op.projects")||"{}"); const ids=Object.keys(last).sort((a,b)=>last[b].updatedAt-last[a].updatedAt); if(ids[0]){ S=JSON.parse(last[ids[0]].json); projectId=ids[0]; } }catch(e){}
renderLib(); fit(); render(); setStatus(projectId?"Открыт последний проект":"Пример — изменения сохранятся автоматически");
(async()=>{
  if(!window.claude||!window.claude.use) { setStatus("Сохранение в этом браузере"); return; }
  try{ downloads=await claude.use("downloads"); }catch(e){}
  try{ store=await claude.use("db"); }catch(e){ store=null; }
  try{ sampleCap=await claude.use("sample"); }catch(e){ sampleCap=null; }
  if(store && !hasUserEdit){ const list=await listProjects(); const p=list.find(x=>x.src==="db"); if(p){ try{ openProject(p.json,p.id); setStatus("Открыт: "+p.name); }catch(e){} } }
  if(!store) setStatus("Сохранение в этом браузере");
})();
</script>
