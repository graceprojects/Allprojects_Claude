<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Планировщик офиса продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: инструментальная панель сверху, библиотека слева, чертёж по центру, свойства справа. Палитра — чертёжная калька + синий карандаш. */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --paper:#ffffff; --ink:#1f2622; --muted:#66706a; --line:#d5d9d2;
  --accent:#1f5fa8; --accent-soft:#dbe7f5; --warn:#b4541e; --ok:#2e7d4f;
  --grid:#e9ece6; --grid-major:#d6dbd3; --wall:#3a3f3b; --glass:#8cc8ec; --glass-edge:#2a78b8; --dim:#b3392f; --sel:#1f5fa8;
  --font-ui:"Golos Text", "Segoe UI", system-ui, sans-serif; --font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a18; --panel:#1e2320; --paper:#232926; --ink:#e7ebe6; --muted:#9aa49d; --line:#343b37;
  --accent:#6aa6ea; --accent-soft:#223449; --warn:#e08a55; --ok:#5fbf86;
  --grid:#2a302c; --grid-major:#353d38; --wall:#c9cfca; --glass:#4b86ad; --glass-edge:#8cc8ec; --dim:#ef7a6e; --sel:#6aa6ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a18; --panel:#1e2320; --paper:#232926; --ink:#e7ebe6; --muted:#9aa49d; --line:#343b37;
  --accent:#6aa6ea; --accent-soft:#223449; --warn:#e08a55; --ok:#5fbf86;
  --grid:#2a302c; --grid-major:#353d38; --wall:#c9cfca; --glass:#4b86ad; --glass-edge:#8cc8ec; --dim:#ef7a6e; --sel:#6aa6ea; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:250px 1fr 310px;grid-template-areas:"top top top" "lib main side"}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand i{display:inline-block;width:18px;height:18px;border:2px solid var(--accent);border-radius:2px;position:relative}
.brand i:after{content:"";position:absolute;left:5px;top:-2px;width:2px;height:10px;background:var(--accent)}
.pname{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;min-width:140px;max-width:260px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--paper);outline:none}
.grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.grp button{border:0;background:transparent;padding:6px 10px;cursor:pointer;white-space:nowrap}
.grp button+button{border-left:1px solid var(--line)}
.grp button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn:focus-visible,.grp button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
#bClaude.live{border-color:var(--ok);color:var(--ok);font-weight:600}
.ailog{margin:6px 0;padding-left:18px;font-size:12px}.ailog li.bad{color:var(--warn)}
.status{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib{grid-area:lib;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.lib .search{padding:10px 12px;border-bottom:1px solid var(--line)}
.lib .search input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.lib .list{overflow:auto;padding:4px 10px 16px;flex:1}
.lib h4{margin:14px 2px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px;cursor:grab;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card svg{width:100%;height:38px;display:block}
.card b{font-weight:500;font-size:11.5px;line-height:1.2}
.card small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.main{grid-area:main;position:relative;min-width:0;min-height:0;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:default}
#plan.pan{cursor:grab}#plan.panning{cursor:grabbing}#plan.draw{cursor:crosshair}
#three{position:absolute;inset:0}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hud .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:8px;font-size:12px;max-width:90%;text-align:center}
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{overflow:auto;padding:12px 14px 24px;flex:1;min-height:0}
.pane h3{margin:2px 0 10px;font-size:15px}
.pane h5{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.one{grid-template-columns:1fr}
.row.four{grid-template-columns:repeat(4,1fr)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:13px;min-width:0;width:100%}
label.f input[type=number]{font-family:var(--font-mono);font-size:12px}
label.f input[type=color]{padding:2px;height:32px}
label.c{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.sw button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button:focus-visible{outline:2px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
table.ex{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.ex th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);padding:5px 4px}
table.ex td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
table.ex td.n{text-align:right;font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
table.ex tr.tot td{font-weight:700;border-bottom:0}
table.ex tr.sub td{color:var(--muted)}
table.ex tr:hover td{background:var(--accent-soft);cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-family:var(--font-mono);font-size:16px;font-weight:600}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:18px}
.dlg h3{margin:0 0 12px}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.pitem div{flex:1;min-width:0}
.pitem small{color:var(--muted);display:block}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;font-size:12.5px;z-index:30}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper)}
.chk{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.chk.red{border-color:var(--warn);color:var(--warn)} .chk.ok{color:var(--ok)}
.lvl{display:inline-block;min-width:54px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:6px;text-align:center}
.lvl.red{background:#f6dcd8;color:#a3342a} .lvl.yellow{background:#f6e8cc;color:#8a5a12} .lvl.info{background:var(--accent-soft);color:var(--accent)} .lvl.ok{background:#dcefe2;color:#2e7d4f}
.checks li{margin:6px 0;font-size:12.5px;line-height:1.4;cursor:pointer} .checks small{color:var(--muted);display:block;margin-left:62px}
.dlg.wiz{max-width:680px} .fitbar{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--paper);font-size:12.5px}
.fitbar b{font-family:var(--font-mono)} .fitbar.bad{border-color:var(--warn)} .fitbar.good{border-color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 10px}
.aibox{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0 4px;background:var(--accent-soft)}
.aibox textarea{width:100%;min-height:58px;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.pks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pk b{font-size:15px} .pk span{font-family:var(--font-mono);font-size:12px;color:var(--accent)} .pk small{font-size:11.5px;color:var(--muted);line-height:1.35}
.pk.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.edt input,.edt select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font-size:12px}
@media (max-width:640px){.pks{grid-template-columns:1fr}}
/* plan styles */
.nss{vector-effect:non-scaling-stroke}
#plan text{font-family:var(--font-ui)}
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto;grid-template-areas:"top" "main" "side" "lib"}
  .lib,.side{border:0;border-top:1px solid var(--line);max-height:none}
  .lib .list{max-height:60vh}
  .pane{max-height:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>Планировщик</div>
    <input id="pname" class="pname" aria-label="Название проекта" value="Офис продаж">
    <button class="btn" id="bProjects">Проекты</button>
    <button class="btn primary" id="bWizard" title="Собрать офис продаж по вопросам">Мастер офиса</button>
    <div class="grp" role="group" aria-label="Уровень">
      <button id="lv0" class="on">1 этаж</button><button id="lv1">Антресоль</button>
    </div>
    <div class="grp" role="group" aria-label="Вид">
      <button id="v2d" class="on">План 2D</button><button id="v3d">3D</button>
    </div>
    <div class="grp" role="group" aria-label="История">
      <button id="bUndo" title="Отменить (Ctrl+Z)">↶</button><button id="bRedo" title="Повторить (Ctrl+Y)">↷</button>
    </div>
    <button class="btn" id="bFit" title="Показать всё здание">Весь план</button>
    <span class="spacer"></span>
    <span class="status" id="status">—</span>
    <button class="btn" id="bClaude" title="Claude: помощник и подключение Claude Desktop / Code">Claude</button>
    <button class="btn primary" id="bExport">Выгрузить</button>
  </header>

  <aside class="lib" aria-label="Библиотека">
    <div class="search"><input id="q" placeholder="Поиск: диван, кабинет, витраж…" aria-label="Поиск по библиотеке"></div>
    <div class="list" id="lib"></div>
  </aside>

  <main class="main">
    <svg id="plan" aria-label="План помещения"></svg>
    <div id="three" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="hud" id="hud"></div>
  </main>

  <aside class="side">
    <div class="tabs" role="tablist">
      <button id="tProps" class="on">Свойства</button><button id="tEx">Экспликация</button><button id="tProj">Здание</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="three.min.js"></script>
<script>
/* KB:BEGIN */

 * Один файл для двух потребителей:
 *   - планировщик (index.html) — встраивается между маркерами KB:BEGIN / KB:END (build.py);
 *   - скилл Claude (.claude/skills/sales-office-planning/scripts) — через Node: require('./office-kb.js').
 * Координаты — метры, X вдоль дороги, Y вглубь (Y = D — витражный фасад у дороги).
 * Площади — в чистоте. Числа — ориентиры для эскиза заказчика, окончательно проверяет проектировщик.

  KB.ZONES = { public: "Публичная", semi: "Полупубличная", private: "Закрытая клиентская", service: "Служебная" };

  // Размеры мебели, которую ставит генератор (w × h, м) — совпадают с каталогом планировщика
  const DIMS = {
    door9: [.9, 1.2], door18: [1.8, 1.2], slide: [1, .3], recep: [3, .8], model: [5, 3], lounge: [2.2, 2.9],
    kidtab: [1, .6], kidmat: [2, 2], led: [2, .2], plant: [.6, .6], cooler: [.35, .35], work3: [1.6, 2.3],
    deskB: [1.8, .9], chairO: [.6, .6], chairV: [.5, .5], os4: [2.8, 2.6], os1: [1.4, 1.3], cab: [.9, .45], shelf: [1, .4],
    safe: [.5, .5], desk: [1.6, .8], meet6: [2.4, 2.1], meet8: [3.2, 2.2], kitch: [2.4, .6], fridge: [.7, .7],
    dine: [1.9, 1.9], bar: [3, .6], stool: [.45, .45], wc: [.4, .7], sink: [.55, .45], cubicle: [1.2, 1.8],

  // Каталог мебели и оборудования: key, название, группа, w, h (глубина), z (высота 3D, "H" — до потолка), тип символа, цвет 3D
  KB.FURN = [
    // проёмы
    ["door9","Дверь 900","Двери и окна",.9,1.2,2.1,"door","#9a7b56"],["door10","Дверь 1000","Двери и окна",1,1.3,2.1,"door","#9a7b56"],
    ["door18","Дверь двустворчатая 1800","Двери и окна",1.8,1.2,2.4,"door2","#9a7b56"],["slide","Дверь раздвижная 1000","Двери и окна",1,.3,2.4,"slide","#a9d3ee"],
    ["auto","Автоматическая дверь 2000","Двери и окна",2,.3,2.6,"auto","#a9d3ee"],["win","Окно 1500","Двери и окна",1.5,.3,1.5,"win","#a9d3ee"],
    // клиентская зона
    ["recep","Стойка ресепшен","Клиентская зона",3,.8,1.1,"recep","#d9c19a"],["recepL","Стойка ресепшен угловая","Клиентская зона",2.6,1.8,1.1,"recepL","#d9c19a"],
    ["model","Стол макета ЖК 5×3","Клиентская зона",5,3,.9,"model","#e9e2d2"],["modelS","Стол макета 3×2","Клиентская зона",3,2,.9,"model","#e9e2d2"],
    ["lounge","Мягкая зона (диван+2 кресла)","Клиентская зона",2.2,2.9,.8,"lounge","#c9c4bb"],
    ["sofa2","Диван 2-местный","Клиентская зона",1.6,.9,.8,"sofa","#b9b2a6"],["sofa3","Диван 3-местный","Клиентская зона",2.2,.9,.8,"sofa","#b9b2a6"],
    ["arm","Кресло","Клиентская зона",.8,.8,.8,"arm","#b9b2a6"],["ctab","Журнальный столик","Клиентская зона",1.2,.6,.45,"table","#e0d6c6"],
    ["bench","Банкетка","Клиентская зона",1.2,.45,.45,"table","#b9b2a6"],["cafe4","Стол кафе на 4","Клиентская зона",1.9,1.9,.75,"cafe4","#e0d6c6"],

    ["kidmat","Игровой коврик","Клиентская зона",2,2,.05,"mat","#f4d36b"],
    // кабинеты
    ["work3","Рабочее место менеджера + 2 гостя","Офисная мебель",1.6,2.3,.75,"work3","#e8e2d6"],["desk","Стол менеджера 1600","Офисная мебель",1.6,.8,.75,"table","#e8e2d6"],

  // Безопасный калькулятор формул: только числа, переменные, + - * / ( ) ? : < > = ! & | , ' и функции min/max/round/ceil/floor/clamp
  KB.evalExpr = function (expr, vars) {
    if (typeof expr === "number") return expr;
    const src = String(expr == null ? "" : expr).trim().replace(/,(?=\d)/g, ".");
    if (!src) return 0;
    if (!/^[\w\s.+\-*/()?:<>=!&|,'"]*$/.test(src)) throw new Error("Недопустимые символы в формуле: " + src);
    const allowed = new Set(["min", "max", "round", "ceil", "floor", "clamp", ...Object.keys(vars)]);
    const ids = src.replace(/'[^']*'|"[^"]*"/g, "").match(/[A-Za-z_]\w*/g) || [];
    for (const id of ids) if (!allowed.has(id)) throw new Error(`Неизвестное имя «${id}» в формуле: ${src}`);
    const fn = new Function("min", "max", "round", "ceil", "floor", "clamp", ...Object.keys(vars), "return (" + src + ");");
    return fn(Math.min, Math.max, Math.round, Math.ceil, Math.floor, (x, a, b) => Math.min(b, Math.max(a, x)), ...Object.values(vars));
  };

  // Программа из пакета: rows с вычисленными n и area; opts[key] включает/выключает строки; counts[key] — ручное количество
  KB.packageProgram = function (pkgKey, A, opts = {}, counts = {}, pkgDef) {
    const P = pkgDef || KB.PACKAGES[pkgKey]; if (!P) throw new Error("Нет пакета " + pkgKey);
    const v = { A: +A || P.A };
    v.M = Math.max(1, Math.round(KB.evalExpr(P.vars.M, v)));
    if (counts.cabinet != null) v.M = Math.max(1, +counts.cabinet);
    v.B = Math.max(0, Math.round(KB.evalExpr(P.vars.B, v)));
    v.seats = Math.max(1, Math.round(KB.evalExpr(P.vars.seats, v)));
    const maket = String(KB.evalExpr(P.vars.maket || "'3x2'", v)); const mk = KB.MAKET[maket] || KB.MAKET["3x2"];
    v.maketArea = +((mk[0] + 2 * (P.gap || 1.2)) * (mk[1] + 2 * (P.gap || 1.2))).toFixed(2);
    const rows = [];
    for (const r of P.rows) {
      const on = r.status === "опция" ? !!opts[r.key] : (r.status === "желательно" ? opts[r.key] !== false : true);
      if (!on) continue;
      let n = counts[r.key] != null ? +counts[r.key] : Math.round(KB.evalExpr(r.n ?? "1", v));
      if (!(n > 0)) continue;
      let w = +r.w || 0, h = +r.h || 0, area = r.area != null ? +KB.evalExpr(r.area, v) : w * h;
      if (r.key === "maket") { w = +(mk[0] + 2 * (P.gap || 1.2)).toFixed(2); h = +(mk[1] + 2 * (P.gap || 1.2)).toFixed(2); area = w * h; }
      const row = { key: r.key, name: r.name, zone: r.zone, cat: r.cat, n, w, h, area: +area.toFixed(2), border: r.border || "wall", status: r.status || "обязательно", rule: r.rule || "", sub: !!r.sub };
      if (r.color) row.color = r.color;
      if (r.key === "lounge") row.seats = v.seats;
      rows.push(row);
    }
    const net = rows.reduce((s, r) => s + r.n * r.area, 0);
    return { rows, vars: v, maket, net: +net.toFixed(1), need: +(net * (P.k || 1.3)).toFixed(0), k: P.k || 1.3 };
  };

    backoffice: ["бэк-офис", "бэк офис", "back"], director: ["руководител", "роп"], kitchen: ["кухн", "приём пищи", "прием пищи", "отдыха"],
    wcs: ["с/у персонал"], kui: ["куи", "уборочн"], elec: ["электрощит"], server: ["сервер", "архив"],
  };
  KB.programFact = function (S) {
    const prog = S.program || []; const rooms = (S.items || []).filter(i => i.t === "room");
    return prog.map(pr => {
      const keys = MATCH[pr.key] || [norm(pr.name).slice(0, 8)];
      const hit = rooms.filter(r => keys.some(k => norm(r.name).includes(k)) && !(pr.key === "meet" && norm(r.name).includes("vip")));
      const area = hit.reduce((s, r) => s + r.w * r.h, 0), target = pr.n * pr.area;
      return { ...pr, placed: hit.length, factArea: +area.toFixed(1), targetArea: +target.toFixed(1),
        state: hit.length < pr.n ? (hit.length === 0 ? "red" : "yellow") : (area < target * 0.9 ? "yellow" : "ok") };
    });
  };

  /* ------------------------------------------------------------ проверки норм (мягкие) */
  KB.checks = function (S) {
    const out = [], b = S.b || {}, items = S.items || [];
    const rooms = items.filter(i => i.t === "room"), R = (lv) => rooms.filter(r => (r.lv || 0) === lv);
    const add = (level, text, ref, id) => out.push({ level, text, ref, id });
    const area = r => r.w * r.h, has = (r, s) => norm(r.name).includes(s);
    const inner = Math.max(0, (b.w - 0.6) * (b.d - 0.6));
    // МГН санузел
    const wcv = rooms.filter(r => has(r, "с/у посетит") || has(r, "мгн"));
    if (!wcv.length && rooms.length) add("red", "Нет санузла для посетителей с универсальной кабиной МГН.", "СП 59.13330.2020 п. 6.3.2");
    for (const r of wcv) if (Math.min(r.w, r.h) < 2.2 || Math.max(r.w, r.h) < 2.25) add("red", `«${r.name}»: меньше 2,20×2,25 м — универсальная кабина МГН не помещается.`, "СП 59.13330.2020 табл. 6.1", r.id);
    // Тамбур
    for (const r of rooms.filter(r => has(r, "тамбур"))) if (r.h < 2.45) add("yellow", `Тамбур: глубина по ходу движения ${r.h.toFixed(2)} м < 2,45 м.`, "СП 59.13330.2020 п. 6.1.8 (сверить редакцию)", r.id);
    // Антресоль
    const m = R(1).filter(r => !r.sub), mA = m.reduce((s, r) => s + area(r), 0);
    if (m.length && b.upper === "floor") {
      if (!items.some(i => i.t === "item" && /^stair/.test(i.k)) && !items.some(i => i.t === "room" && /лестниц/i.test(i.name))) add("info", "Лестница на 2 этаж в плане не показана (если она снаружи — ок).", "СП 1.13130.2020");
    } else if (m.length) {
      if (b.h < 4.7) add("red", `Высота зала ${b.h} м < 4,7 м — антресоль невозможна.`, "СП 118.13330.2022 п. 4.26");
      if (b.h - b.mz < 2.2) add("red", `Над антресолью ${(b.h - b.mz).toFixed(2)} м < 2,2 м.`, "СП 118.13330.2022 п. 4.26");
      if (b.mz - 0.3 < 2.2) add("red", `Под антресолью ${(b.mz - 0.3).toFixed(2)} м < 2,2 м.`, "СП 118.13330.2022 п. 4.26");
      const share = inner ? mA / inner : 0;
      if (share >= 0.4) add("red", `Антресоль ${Math.round(share * 100)}% площади помещения — может считаться этажом.`, "СП 118.13330.2022 п. 3.1.2");
      else if (share >= 0.35) add("yellow", `Антресоль ${Math.round(share * 100)}% — близко к пределу 40%.`, "СП 118.13330.2022 п. 3.1.2");
      if (mA > 300) add("red", "Антресоль больше 300 м² — нужна вторая лестница.", "СП 1.13130.2020 п. 4.2.7");
      if (!items.some(i => i.t === "item" && /^stair/.test(i.k))) add("red", "На антресоль нет лестницы.", "СП 1.13130.2020 п. 4.4");
      for (const r of m) if (["client", "meet", "office"].includes(r.cat)) add("yellow", `«${r.name}» — клиентское помещение на антресоли: нужен подъёмник для МГН или перенос вниз.`, "СП 59.13330.2020", r.id);
      if (!items.some(i => i.t === "wall" && i.lv === 1 && i.kind === "rail")) add("yellow", "На краю антресоли нет ограждения (h ≥ 1,2 м).", "СП 118.13330.2022 п. 6.12");
    }
    // Бэк-офис: площадь на рабочее место
    const seatsOf = it => ({ os1: 1, os4: 4, work3: 1 }[it.k] || 0);
    for (const r of rooms.filter(r => has(r, "бэк-офис"))) {
      const n = items.filter(i => i.t === "item" && (i.lv || 0) === (r.lv || 0) && i.x >= r.x - .01 && i.y >= r.y - .01 && i.x <= r.x + r.w && i.y <= r.y + r.h).reduce((s, i) => s + seatsOf(i), 0);
      if (n && area(r) / n < 4.5) add("yellow", `«${r.name}»: ${(area(r) / n).toFixed(1)} м² на рабочее место < 4,5 м².`, "МР 2.2.0244-21 (рекомендация)", r.id);
    }
    // Кухня
    const par = (S.meta && S.meta.params) || null;
    if (par) { const staff = par.M + par.B + (par.director ? 1 : 0) + 1, need = staff <= 10 && par.pkg ? 6 : Math.max(12, staff); const k = rooms.filter(r => has(r, "кухн") || has(r, "приём пищи"));
      const kA = k.reduce((s, r) => s + area(r), 0); if (kA + 0.01 < need) add("yellow", `Кухня ${kA.toFixed(1)} м² < ${need} м² (${staff} чел. в смене).`, "СП 44.13330.2011 п. 5.51–5.52 (сверить)"); }
    // Кабинет приёма
    for (const r of rooms.filter(r => has(r, "кабинет менеджер"))) if (area(r) < 9) add("info", `«${r.name}» ${area(r).toFixed(1)} м² — тесно для приёма клиентов (реком. ≥ 9–12 м²).`, "СП 118.13330.2022 п. 5.31 (рекомендация)", r.id);
    // Коридоры
    for (const r of rooms.filter(r => has(r, "коридор") || has(r, "галерея"))) { const w = Math.min(r.w, r.h); if (w < 1.2) add("red", `«${r.name}» шириной ${w.toFixed(2)} м < 1,2 м.`, "СП 1.13130.2020 п. 4.3.4", r.id); else if (w < 1.5) add("yellow", `«${r.name}» ${w.toFixed(2)} м: для разъезда кресел нужно ≥ 1,5–1,8 м.`, "СП 59.13330.2020 п. 6.2.1", r.id); }
    // Геометрия: за контуром здания и пересечения
    for (const r of rooms) if (r.x < -0.01 || r.y < -0.01 || r.x + r.w > b.w + 0.01 || r.y + r.h > b.d + 0.01) add("red", `«${r.name}» выходит за контур здания.`, "геометрия", r.id);
    for (const lv of [0, 1]) { const rs = R(lv).filter(r => !r.sub && !has(r, "зал"));
      for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) { const a = rs[i], c = rs[j];
        const ox = Math.min(a.x + a.w, c.x + c.w) - Math.max(a.x, c.x), oy = Math.min(a.y + a.h, c.y + c.h) - Math.max(a.y, c.y);
        if (ox > 0.15 && oy > 0.15) add("yellow", `«${a.name}» и «${c.name}» перекрываются.`, "геометрия", a.id); } }
    // Программа
    if (S.program && S.program.length) for (const f of KB.programFact(S)) {
      if (f.placed < f.n) add(f.status === "обязательно" ? "red" : "info", `Программа: «${f.name}» ${f.placed} из ${f.n}.`, "программа помещений");
      else if (f.state === "yellow") add("info", `Программа: «${f.name}» ${f.factArea} м² при цели ${f.targetArea} м².`, "программа помещений");
    }
    const order = { red: 0, yellow: 1, info: 2 };
    return out.sort((a, c) => order[a.level] - order[c.level]);
  };

  /* ------------------------------------------------------------ текстовая сводка (для Claude и CLI) */
  KB.summary = function (S) {
    const rooms = (S.items || []).filter(i => i.t === "room" && !i.sub);
    const a0 = rooms.filter(r => !r.lv).reduce((s, r) => s + r.w * r.h, 0), a1 = rooms.filter(r => r.lv === 1).reduce((s, r) => s + r.w * r.h, 0);
    const lines = [`${S.name}: здание ${S.b.w}×${S.b.d}×${S.b.h} м, 1 этаж ${a0.toFixed(1)} м², ${S.b.upper === "floor" ? "2 этаж" : "антресоль"} ${a1.toFixed(1)} м²`];
    if (S.program) { lines.push("Программа (цель → факт):"); for (const f of KB.programFact(S)) lines.push(`  ${f.state === "ok" ? "✓" : f.state === "yellow" ? "~" : "✗"} ${f.name}: ${f.placed}/${f.n} шт, ${f.factArea}/${f.targetArea} м²`); }
    const ch = KB.checks(S); lines.push(`Проверки: ${ch.filter(c => c.level === "red").length} красных, ${ch.filter(c => c.level === "yellow").length} жёлтых`);
    for (const c of ch) lines.push(`  [${c.level}] ${c.text} (${c.ref})`);
    return lines.join("\n");
  };

  /* ============================================================ КОМАНДЫ ПЛАНИРОВЩИКА (для Claude / MCP / ИИ-помощника)
   * Все команды меняют проект S на месте и возвращают { ok, msg, ids }.
   * Помещение или предмет указывается id или названием («Кабинет менеджера 2», «кухня»).
   * Координаты — метры от левого верхнего угла здания: X вдоль дороги, Y вглубь, фасад с витражом — Y = b.d.
   */
  const isDoorK = k => /^(door|slide|auto|win)/.test(k || "");
  const aabbOf = it => { if (it.t !== "item") return { x: it.x, y: it.y, w: it.w, h: it.h };
    const q = (it.rot || 0) % 180 !== 0; return { x: it.x, y: it.y, w: q ? it.h : it.w, h: q ? it.w : it.h }; };
  KB.aabb = aabbOf;
  const lvOf = it => it.lv || 0;
  const inside = (a, r, m = 0) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2; return cx >= r.x - m && cx <= r.x + r.w + m && cy >= r.y - m && cy <= r.y + r.h + m; };
  const overlap = (a, c, m = 0) => a.x < c.x + c.w + m && a.x + a.w + m > c.x && a.y < c.y + c.h + m && a.y + a.h + m > c.y;
  const isHall = r => /зал|холл|open-space продаж/i.test(r.name || "") && !r.sub;
  const isCirc = r => r.cat === "circ" || /проход|коридор|галерея/i.test(r.name || "");

  /* Типы помещений: как распознать по названию, категория, ограждение, типовой размер и наполнение. */
  KB.ROOM_TYPES = [
    { key: "tambour", re: /тамбур/, cat: "circ", border: "glass", size: [2.6, 2.5] },
    { key: "reception", re: /ресепшен|хостес|стойка/, cat: "client", border: "none", size: [4.4, 2.2], zone: true },
    { key: "kids", re: /детск/, cat: "client", border: "none", size: [3.5, 3.5], zone: true, color: "#F4D36B" },
    { key: "maket", re: /макет/, cat: "client", border: "none", size: [7.4, 5.4], zone: true, color: "#F2F0EA" },
    { key: "cafe", re: /кофе|бар|кафе/, cat: "client", border: "none", size: [4, 3.2], zone: true, color: "#D9B98E" },
    { key: "lounge", re: /ожидан|лаунж|мягк/, cat: "client", border: "none", size: [5, 4], zone: true },
    { key: "media", re: /медиа|vr/, cat: "client", border: "none", size: [3.5, 3], zone: true },
    { key: "showroom", re: /шоурум|материал/, cat: "client", border: "glass", size: [5, 3.2] },
    { key: "wardrobe", re: /гардероб/, cat: "staff", border: "wall", size: [2, 3.2] },
    { key: "opendesk", re: /место консультац|open-space продаж/, cat: "office", border: "none", size: [2.8, 2.6], zone: true },
    { key: "bank", re: /ипотек|банк|брокер|юрист/, cat: "office", border: "glass", size: [3, 3.2] },
    { key: "cabinet", re: /кабинет менеджер|кабинет продаж|менеджер/, cat: "office", border: "glass", size: [3, 3.2] },
    { key: "vip", re: /сделочн|vip/, cat: "meet", border: "glass", size: [5, 4.5] },
    { key: "meet", re: /переговорн/, cat: "meet", border: "glass", size: [4.5, 3.2] },
    { key: "cashier", re: /касса/, cat: "service", border: "wall", size: [3, 3] },
    { key: "director", re: /руководител|роп|директор/, cat: "back", border: "wall", size: [4.5, 4] },
    { key: "backoffice", re: /бэк|back|бухгалтер|open-space/, cat: "back", border: "glass", size: [6, 5] },
    { key: "kitchen", re: /кухн|приём пищи|прием пищи|комната отдыха/, cat: "staff", border: "wall", size: [4, 3.5] },
    { key: "wcv", re: /мгн|посетит|универсал/, cat: "wc", border: "wall", size: [2.4, 2.4], color: "#CFE8E6", wc: true },
    { key: "wcs", re: /с\/у|санузел|туалет|wc/, cat: "wc", border: "wall", size: [1.8, 2.5], color: "#CFE8E6", wc: true },
    { key: "kui", re: /куи|уборочн/, cat: "service", border: "wall", size: [1.8, 2] },
    { key: "elec", re: /электрощит|щитов|слаботоч/, cat: "service", border: "wall", size: [2, 2.5] },
    { key: "server", re: /сервер/, cat: "service", border: "wall", size: [2, 2.5] },
    { key: "archive", re: /архив|склад|кладов/, cat: "service", border: "wall", size: [2.5, 3] },
    { key: "security", re: /охран/, cat: "service", border: "wall", size: [2, 2] },
    { key: "stair", re: /лестниц/, cat: "circ", border: "wall", size: [2.8, 5.1] },
    { key: "corridor", re: /коридор|проход|галерея/, cat: "circ", border: "none", size: [1.8, 6], zone: true },

  KB.roomType = function (name) {
    const n = norm(name);
    // «с/у посетителей», «с/у МГН» — посетительский; любой другой с/у — персонала
    for (const t of KB.ROOM_TYPES) if (t.re.test(n)) { if (t.key === "wcv" && !/с\/у|санузел|туалет|wc|кабин/.test(n)) continue; return t; }
    return null;
  };

  /* ---------- поиск элементов */
  function findEl(S, ref, t) {
    if (ref == null || ref === "") throw new Error("Не указан элемент (id или название).");
    const pool = S.items.filter(i => !t || i.t === t);
    const byId = pool.find(i => i.id === String(ref)); if (byId) return byId;
    const n = norm(ref).trim();
    const label = i => norm(i.t === "room" ? i.name : i.t === "item" ? (i.label || (KB.FK[i.k] ? KB.FK[i.k].n : i.k)) : i.kind);
    let hit = pool.filter(i => label(i) === n); if (hit.length === 1) return hit[0];
    if (!hit.length) hit = pool.filter(i => label(i).includes(n));
    if (hit.length === 1) return hit[0];
    if (!hit.length) throw new Error(`Не найдено: «${ref}». Посмотрите список в describe_plan.`);
    throw new Error(`«${ref}» — несколько совпадений: ${hit.slice(0, 8).map(i => `${i.id} (${i.t === "room" ? i.name : i.k} @ ${(+i.x || 0).toFixed(1)},${(+i.y || 0).toFixed(1)})`).join("; ")}. Укажите id.`);
  }
  KB.findEl = findEl;
  // Предметы внутри помещения (центр внутри; двери — с допуском на толщину стены)
  KB.contents = function (S, r) {
    return S.items.filter(i => i !== r && lvOf(i) === lvOf(r) && (i.t === "item" ? inside(aabbOf(i), r, isDoorK(i.k) ? 0.35 : 0)
      : i.t === "room" ? (i.sub && !r.sub && inside(i, r) && i.w * i.h < r.w * r.h) : false));
  };

  /* ---------- сторона двери: где снаружи проход / зал, а не другое помещение и не наружная стена */
  function sideScore(S, r, side) {
    const b = S.b, lv = lvOf(r), e = 0.35;
    const mid = side === "n" ? [r.x + r.w / 2, r.y - e] : side === "s" ? [r.x + r.w / 2, r.y + r.h + e] : side === "w" ? [r.x - e, r.y + r.h / 2] : [r.x + r.w + e, r.y + r.h / 2];
    const [px, py] = mid;
    if (px < 0.3 || py < 0.3 || px > b.w - 0.3 || py > b.d - 0.3) return -10;          // наружу
    const here = S.items.filter(i => i.t === "room" && i !== r && lvOf(i) === lv && px > i.x && px < i.x + i.w && py > i.y && py < i.y + i.h);
    if (!here.length) return lv ? -5 : 2;                                                  // открытое пространство (на антресоли — пустота)
    const solid = here.filter(i => !i.sub && !isHall(i) && !isCirc(i));
    if (solid.length) return -3;
    if (here.some(isCirc)) return 4;
    if (here.some(isHall)) return 3;
    return 1;                                                                              // зона без стен
  }
  KB.doorSide = function (S, r) {
    let best = "s", bs = -1e9;
    for (const s of ["s", "n", "e", "w"]) { const v = sideScore(S, r, s) + ((s === "n" || s === "s") ? (r.w >= r.h ? 0.3 : 0) : (r.h > r.w ? 0.3 : 0)); if (v > bs) { bs = v; best = s; } }
    return best;
  };
  // Сторона, обращённая к входу/фасаду — для зон без стен (ресепшен, макет смотрят на посетителя)
  function faceSide(S, r) {
    const ent = S.items.find(i => i.t === "item" && lvOf(i) === 0 && (i.k === "auto" || /вход/i.test(i.label || "")) && !/служеб/i.test(i.label || ""));
    const tx = ent ? ent.x + aabbOf(ent).w / 2 : r.x + r.w / 2, ty = ent ? ent.y : S.b.d;
    const dx = tx - (r.x + r.w / 2), dy = ty - (r.y + r.h / 2);
    return Math.abs(dy) >= Math.abs(dx) * 0.8 ? (dy > 0 ? "s" : "n") : (dx > 0 ? "e" : "w");
  }

  /* ---------- локальная система помещения: u — вдоль «лицевой» стены, v — от задней стены к лицевой.
   * face: n|s|e|w — лицевая сторона (дверь / обзор). Предмет в локальных координатах: ставим по центру (cu, cv) с поворотом rl. */
  function frame(r, face) {
    const Wl = face === "n" || face === "s" ? r.w : r.h, Dl = face === "n" || face === "s" ? r.h : r.w;
    const toW = (cu, cv) => face === "s" ? [r.x + cu, r.y + cv, 0] : face === "n" ? [r.x + r.w - cu, r.y + r.h - cv, 180]
      : face === "e" ? [r.x + cv, r.y + r.h - cu, 270] : [r.x + r.w - cv, r.y + cu, 90];
    return { W: Wl, D: Dl, put(k, u, v, rl = 0, o = {}) {   // u, v — левый-задний угол предмета в локальных координатах
      const f = KB.FK[k] || { w: 1, h: 1 }, w = o.w || f.w, h = o.h || f.h;
      const lw = rl % 180 ? h : w, lh = rl % 180 ? w : h;
      const [cx, cy, ra] = toW(u + lw / 2, v + lh / 2), rot = (rl + ra) % 360, q = rot % 180 !== 0;
      const aw = q ? h : w, ah = q ? w : h;
      return Object.assign({ id: uid(), t: "item", lv: lvOf(r), k, x: r3(cx - aw / 2), y: r3(cy - ah / 2), w, h, rot, flip: false, label: "" }, o, { w, h });
    } };
  }
  function slideDoor(r, side, off) {
    const lv = lvOf(r);
    if (side === "s") return { id: uid(), t: "item", lv, k: "slide", x: r3(r.x + off), y: r3(r.y + r.h - 0.15), w: 1, h: 0.3, rot: 0, flip: false, label: "" };

  }

  /* ---------- автоматическое наполнение помещения мебелью по его типу */
  KB.furnishRoom = function (S, r, o = {}) {
    const T = KB.roomType(r.name) || { key: "other" }, out = [], lv = lvOf(r);
    const zone = r.border === "none";
    const face = o.face || (zone ? faceSide(S, r) : KB.doorSide(S, r));
    const F = frame(r, face), W = F.W, D = F.D, P = (...a) => out.push(F.put(...a));
    const cU = w => Math.max(0.1, (W - w) / 2);
    // дверь (если у помещения есть стены)
    if (!zone && o.door !== false && T.key !== "stair") {
      const along = face === "n" || face === "s" ? r.w : r.h, dw = T.key === "wcv" ? 1.0 : (T.wc || /куи|щит|сервер/.test(T.key) ? 0.8 : 0.9);
      const off0 = Math.min(0.3, Math.max(0.05, along - dw - 0.05)), off = face === "n" || face === "e" ? Math.max(0.05, along - dw - off0) : off0; // дверь всегда слева в локальной системе
      const inward = !(T.wc || T.key === "kui" || T.key === "elec" || T.key === "server" || T.key === "archive");
      out.push(r.border === "glass" && T.key !== "vip" && T.key !== "meet" && T.key !== "showroom" ? slideDoor(r, face, off) : door(r, face, off, dw, inward));
    }
    const doorZone = 1.1; // у лицевой стены возле двери оставляем свободно
    switch (T.key) {
      case "cabinet": case "bank": case "opendesk":
        P("work3", cU(1.6), zone ? Math.max(0.1, (D - 2.3) / 2) : Math.min(0.4, Math.max(0.05, D - 2.3 - 0.9)));
        if (!zone && W >= 3.6) P("cab", W - 0.95, 0.05); break;
      case "meet": case "vip": {
        const opts = [["meet10", 4, 2.2], ["meet8", 3.2, 2.2], ["meet6", 2.4, 2.1], ["round4", 1.9, 1.9]];
        let fitT = opts[3], rl = 0;
        for (const t of (T.key === "vip" ? opts.slice(1) : opts)) { if (t[1] + 1.4 <= W && t[2] + 1.0 <= D) { fitT = t; rl = 0; break; } if (t[2] + 1.0 <= W && t[1] + 1.4 <= D) { fitT = t; rl = 90; break; } }
        const lw = rl ? fitT[2] : fitT[1], lh = rl ? fitT[1] : fitT[2];
        P(fitT[0], cU(lw), Math.max(0.5, (D - lh) / 2 - (D - lh > 1.6 ? 0.2 : 0)), rl);
        if (W >= 4 && D - lh >= 2.2) P("led", cU(2), 0.02);

      case "director": {

        P("chairO", cU(0.6), 0.6, 180); P("deskB", cU(1.8), 1.25); P("chairV", W / 2 - 0.75, 2.3); P("chairV", W / 2 + 0.25, 2.3);

        const cols4 = Math.floor((W - 0.6) / 3.6), rows4 = Math.floor((D - doorZone - 0.5) / 3.4);
        for (let j = 0; j < rows4 && seats + 2 < need; j++) for (let i = 0; i < cols4 && seats + 2 < need; i++) { P("os4", 0.4 + i * 3.6, 0.5 + j * 3.4); seats += 4; }
        const y1 = rows4 && seats ? 0.5 + Math.ceil(seats / 4 / Math.max(1, cols4)) * 3.4 : 0.3;

      case "kitchen": {
        const kw = Math.min(2.4, W - 0.9); P("kitch", 0.1, 0.02, 0, { w: kw }); P("fridge", Math.min(W - 0.75, kw + 0.15), 0.02);

      case "wcv": P("wc", 0.9, 0.05); P("sink", W - 0.6, Math.min(1.2, D - 1.5), 90);

      case "wcs": P("wc", Math.min(0.6, W - 0.5), 0.05); P("sink", W - 0.5, Math.min(1.0, D - 1.3), 90); break;
      case "kui": case "server": case "archive": P("shelf", 0.1, 0.05, 0, { w: Math.max(0.6, Math.min(W - 0.2, 3)) });

      case "elec": P("cab", 0.1, 0.05, 0, { w: Math.max(0.6, Math.min(W - 0.2, 1.8)), label: "щиты" }); break;
      case "security": case "cashier": P("desk", 0.15, 0.1, 0, { w: Math.min(1.6, W - 0.4) }); P("chairO", 0.6, 0.95, 180);
        if (T.key === "cashier") P("safe", W - 0.6, 0.05); break;

        const sw = Math.min(3, W - 0.6); P("recep", cU(sw), Math.max(0.9, D - 1.2), 0, { w: sw }); P("chairO", W / 2 - 0.3, Math.max(0.1, D - 2.0));
        if (W >= 4) P("cab", 0.1, 0.05); break; }
      case "lounge": {
        const gw = 2.4, gh = 3.1, nx = Math.max(1, Math.floor((W + 0.4) / (gw + 0.6))), ny = Math.max(1, Math.floor((D + 0.3) / (gh + 0.5)));

        P("model", cU(pick[1]), (D - pick[2]) / 2, 0, { w: pick[1], h: pick[2], label: "макет " + pick[0].replace("x", "×") });

      case "kids": P("kidmat", 0.2, 0.2, 0, { w: Math.min(2, W - 0.4), h: Math.min(2, D - 0.4) });

      case "cafe": { const bw = Math.min(3, W - 0.4); P("bar", cU(bw), 0.1, 0, { w: bw }); const ns = Math.max(1, Math.floor(bw / 0.75));

      case "showroom": { const n = Math.max(1, Math.floor((W - 0.4) / 1.3)); for (let i = 0; i < n; i++) P("stand", 0.2 + i * 1.3, 0.05);
        if (D >= 3) P("ctab", cU(1.2), Math.min(D - 1.8, 1.5), 0, { label: "образцы" }); break; }

    }
    // обрезаем то, что вылезло за помещение (кроме дверей)
    const bad = out.filter(i => !isDoorK(i.k) && (() => { const a = aabbOf(i); return a.x < r.x - 0.02 || a.y < r.y - 0.02 || a.x + a.w > r.x + r.w + 0.02 || a.y + a.h > r.y + r.h + 0.02; })());
    const res = out.filter(i => !bad.includes(i)); res._note = [out._note, bad.length ? `не поместилось предметов: ${bad.length}` : ""].filter(Boolean).join(", "); res._face = face;

  };

  /* ---------- свободное место */
  KB.findSpace = function (S, o = {}) {

    const blocks = S.items.filter(i => lvOf(i) === lv && i !== within && (i.t === "item" ? true : i.t === "room" ? !isHall(i) && !(within && i.sub && !inside(i, within)) : false)).map(i => i.t === "wall" ? null : aabbOf(i)).filter(Boolean);
    const box = within ? { x: within.x, y: within.y, w: within.w, h: within.h } : { x: t, y: t, w: b.w - 2 * t, h: b.d - 2 * t };

  /* ---------- команды */
  const num = (v, name) => { const n = +v; if (!isFinite(n)) throw new Error(`Параметр ${name} должен быть числом (м).`); return n; };
  KB.OPS = {
    building(S, a) { for (const k of ["w", "d", "h", "mz"]) if (a[k] != null) S.b[k] = num(a[k], k); if (a.name) S.name = String(a.name); if (a.notes != null) S.notes = String(a.notes);
      return { msg: `Здание ${S.b.w}×${S.b.d}×${S.b.h} м` }; },
    add_room(S, a) {
      const T = KB.roomType(a.name) || {}, sz = T.size || [3, 3];
      const w = a.w != null ? num(a.w, "w") : sz[0], h = a.h != null ? num(a.h, "h") : sz[1];

      if (x == null || y == null) { const sp = KB.findSpace(S, { w, h, lv: a.lv || 0, near: a.near || (T.cat === "client" ? "facade" : "back"), limit: 1 })[0];
        if (!sp) throw new Error(`Нет свободного места ${w}×${h} м для «${a.name}». Уменьшите размер или освободите место.`); x = sp.x; y = sp.y; }

        { lv: a.lv || 0, sub: a.sub != null ? !!a.sub : !!T.zone && !/^(hall|corridor)$/.test(T.key), color: a.color || T.color || (KB.CAT[cat] || KB.CAT.client).c });

    },
    update(S, a) {

      const kids = it.t === "room" && a.move_contents !== false ? KB.contents(S, it) : [];

      for (const k of ["x", "y", "w", "h"]) if (a[k] != null) it[k] = r3(num(a[k], k));
      if (a.dx) it.x = r3(it.x + +a.dx); if (a.dy) it.y = r3(it.y + +a.dy);
      if (a.new_name != null) it.name = String(a.new_name); if (a.label != null) it.label = String(a.label);

      if ((dx || dy) && kids.length) for (const c of kids) { c.x = r3(c.x + dx); c.y = r3(c.y + dy); }

      if (it.t === "room" && (a.w != null || a.h != null) && a.refurnish !== false && kids.some(c => c.t === "item")) {
        S.items = S.items.filter(i => !(kids.includes(i) && i.t === "item")); const f = KB.furnishRoom(S, it); S.items.push(...f); note = ", мебель переставлена";

      return { msg: `«${it.t === "room" ? it.name : it.k}»: ${it.w}×${it.h} в (${it.x}; ${it.y})${kids.length && (dx || dy) ? `, перенесено вместе с содержимым (${kids.length})` : ""}${note}`, ids: [it.id] };
    },
    delete(S, a) {

    },
    add_item(S, a) {
      const f = KB.FK[a.k]; if (!f) throw new Error(`Нет предмета «${a.k}» в каталоге. Список — list_catalog.`);

      for (let i = 0; i < n; i++) { const it = { id: uid(), t: "item", lv, k: a.k, x: r3(num(x, "x") + (dir === "x" ? i * (aw + gap) : 0)), y: r3(num(y, "y") + (dir === "y" ? i * (ah + gap) : 0)), w, h, rot, flip: !!a.flip, label: a.label || "" };

    },
    clear(S, a) { const r = findEl(S, a.room || a.id || a.name, "room"); const drop = new Set(KB.contents(S, r).filter(i => i.t === "item" && (a.doors || !isDoorK(i.k))));
      S.items = S.items.filter(i => !drop.has(i)); return { msg: `«${r.name}»: убрано предметов ${drop.size}` }; },
    add_door(S, a) {
      const r = findEl(S, a.room || a.id || a.name, "room"); const side = a.side || KB.doorSide(S, r), w = +a.width || 0.9;
      const along = side === "n" || side === "s" ? r.w : r.h, off = a.offset != null ? +a.offset : Math.max(0.05, Math.min(0.3, along - w - 0.05));

      S.items.push(d); return { msg: `Дверь ${Math.round(w * 1000)} в «${r.name}», сторона ${side}`, ids: [d.id] };
    },
    add_wall(S, a) { const kind = a.kind || "part", TH = { ext: 0.3, block: 0.2, part: 0.1, glass: 0.1, vitrage: 0.15, rail: 0.05 };
      if (!TH[kind]) throw new Error("kind: ext|block|part|glass|vitrage|rail");
      const wl = { id: uid(), t: "wall", lv: a.lv || 0, kind, x1: num(a.x1, "x1"), y1: num(a.y1, "y1"), x2: num(a.x2, "x2"), y2: num(a.y2, "y2"), th: TH[kind] };
      S.items.push(wl); return { msg: `Стена ${kind} ${Math.hypot(wl.x2 - wl.x1, wl.y2 - wl.y1).toFixed(2)} м`, ids: [wl.id] }; },

function planMarkup(lv, opt={}){

function bindProps(it){
  const ch=(id,fn)=>{ const el=$("#"+id); if(el) el.addEventListener("change",()=>{ pushUndo(); fn(el); if(it.t==="item") fixDoor(it); commit(); }); };
  const n=el=>+String(el.value).replace(",",".");
  ch("pN",el=>it.name=el.value); ch("pCat",el=>{ it.cat=el.value; it.color=CAT[el.value].c; }); ch("pB",el=>it.border=el.value);
  const len=el=>{ let v=n(el); if(!isFinite(v)) v=0; return v>=100 ? v/1000 : v; }; // «3200» = 3200 мм
  ch("pX",el=>it.x=n(el)); ch("pY",el=>it.y=n(el)); ch("pW",el=>it.w=Math.max(.1,len(el))); ch("pH",el=>it.h=Math.max(.1,len(el)));
  ch("pC",el=>it.color=el.value); ch("pPH",el=>it.ph=Math.max(.5,n(el))); ch("pSub",el=>it.sub=el.checked);
  ch("pK",el=>{ it.kind=el.value; it.th=WALLS[el.value].th; }); ch("pT",el=>it.th=Math.max(.02,n(el)));
  ch("pX1",el=>it.x1=n(el)); ch("pY1",el=>it.y1=n(el)); ch("pX2",el=>it.x2=n(el)); ch("pY2",el=>it.y2=n(el));
  ch("pL",el=>{ const L=Math.hypot(it.x2-it.x1,it.y2-it.y1)||1, k=n(el)/L; it.x2=it.x1+(it.x2-it.x1)*k; it.y2=it.y1+(it.y2-it.y1)*k; });
  ch("pLb",el=>it.label=el.value); ch("pR",el=>it.rot=+el.value);
  document.querySelectorAll("[data-floor]").forEach(b=>b.onclick=()=>{ pushUndo(); it.color=b.dataset.floor; commit(); });
  const act=(id,fn)=>{ const el=$("#"+id); if(el) el.onclick=()=>{ pushUndo(); fn(); commit(); }; };
  act("aDel",()=>{ S.items=S.items.filter(i=>i.id!==it.id); sel=null; });
  act("aDup",()=>dup(it)); act("aRot",()=>rot(it)); act("aFlip",()=>it.flip=!it.flip);
  act("aStd",()=>{ const f=FK[it.k]; it.w=f.w; it.h=f.h; });
  act("aLv",()=>{ it.lv=it.lv?0:1; level=it.lv; });
}
function dup(it){ const c=JSON.parse(JSON.stringify(it)); c.id=uid(); if(c.t==="wall"){ c.x1+=.5;c.x2+=.5;c.y1+=.5;c.y2+=.5; } else { c.x+=.5; c.y+=.5; } S.items.push(c); sel=c.id; }
function rot(it){ if(it.t==="room"){ [it.w,it.h]=[it.h,it.w]; return; } if(it.t==="wall") return;
  const a=aabb(it), cx=a.x+a.w/2, cy=a.y+a.h/2; it.rot=((it.rot||0)+90)%360; const b=aabb(it); it.x=snap(cx-b.w/2); it.y=snap(cy-b.h/2); }

function explRows(){

function furnSpec(){ const m={}; for(const it of S.items.filter(i=>i.t==="item")){ const f=FK[it.k]; const key=f.n+" "+Math.round(it.w*1000)+"×"+Math.round(it.h*1000);
  m[key]=m[key]||{n:f.n,g:f.g,size:`${Math.round(it.w*1000)}×${Math.round(it.h*1000)}`,c0:0,c1:0}; m[key][it.lv?"c1":"c0"]++; }
  return Object.values(m).sort((a,b)=>a.g.localeCompare(b.g)||a.n.localeCompare(b.n)); }
function explicationHTML(){

  o+=`<div class="actions"><button class="btn" data-exp="csv">Экспликация в Excel (CSV)</button></div>`;

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ const md=document.querySelector(".modal"); if(md){ md.remove(); return; } }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if(e.code==="Space"&&!typing){ spaceDown=true; svg.classList.add("pan"); if(view==="2d") e.preventDefault(); }
  if(typing) return;
  const it=sel&&byId(sel), k=e.key.toLowerCase(), ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&(k==="z"||k==="я")){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); return; }
  if(ctrl&&(k==="y"||k==="н")){ e.preventDefault(); doRedo(); return; }
  if(e.key==="Escape"){ if(drag&&(drag.mode==="move"||drag.mode==="resize"||drag.mode==="wend"||drag.mode==="bres")&&undo.length){ S=JSON.parse(undo.pop()); }
    drag=null; guides=[]; tool=null; setToolUI(); sel=null; drawPreview=null; render(); return; }
  if(!it) return;
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); pushUndo(); S.items=S.items.filter(i=>i.id!==sel); sel=null; commit(); return; }
  if(ctrl&&(k==="d"||k==="в")){ e.preventDefault(); pushUndo(); dup(it); commit(); return; }
  if((k==="r"||k==="к")&&!ctrl){ pushUndo(); rot(it); commit(); return; }

const statusEl=$("#status"); let saveTimer=null;

async function saveNow(){
  if(!projectId) projectId=uid(); const rec={name:S.name, updatedAt:Date.now(), json:JSON.stringify(S)};
  try{ if(store){ await store.collection("projects").doc(projectId).set(rec); setStatus("Сохранено в проекте · "+new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})); dirty=false; return; } }catch(e){ setStatus("Не удалось сохранить: "+(e.code||e.message)+" · копия в браузере"); }
  try{ const all=JSON.parse(localStorage.getItem("op.projects")||"{}"); all[projectId]=rec; localStorage.setItem("op.projects",JSON.stringify(all)); if(!store) setStatus("Сохранено в этом браузере"); dirty=false; }catch(e){ if(!store) setStatus("Не сохранено — выгрузите файл проекта"); }
}
async function listProjects(){
  const out=[]; try{ if(store){ const q=await store.collection("projects").get(); for(const d of q.docs){ const v=d.data(); out.push({id:d.id,name:v.name,updatedAt:v.updatedAt,json:v.json,src:"db"}); } } }catch(e){}
  try{ const all=JSON.parse(localStorage.getItem("op.projects")||"{}"); for(const [id,v] of Object.entries(all)) if(!out.find(o=>o.id===id)) out.push({id,...v,src:"local"}); }catch(e){}
  return out.sort((a,b)=>b.updatedAt-a.updatedAt);
}
async function deleteProject(p){ try{ if(p.src==="db"&&store) await store.collection("projects").doc(p.id).delete(); }catch(e){}
  try{ const all=JSON.parse(localStorage.getItem("op.projects")||"{}"); delete all[p.id]; localStorage.setItem("op.projects",JSON.stringify(all)); }catch(e){} }

let downloads=null, sampleCap=null;
function exportSVG(){
  const b=S.b, pad=2.5, gap=4, lvls=S.items.some(i=>i.lv===1)?[0,1]:[0];
  const planH=b.d+pad*2, W=b.w+pad*2+14; let y=pad+1.2, body="";
  const css=`<style>:root{--paper:#fff;--ink:#222;--muted:#777;--wall:#3a3f3b;--glass:#9fd3f0;--glass-edge:#2a78b8;--dim:#b3392f;--grid:#eee;--grid-major:#ddd}.nss{vector-effect:non-scaling-stroke}text{font-family:Arial,sans-serif}</style>`;
  const title=`<text x='${pad}' y='1.3' font-size='.7' font-weight='700'>${esc(S.name)} — ${fmt(b.w,1)} × ${fmt(b.d,1)} м</text>`;
  for(const lv of lvls){ body+=`<text x='${pad}' y='${y}' font-size='.45' font-weight='700'>${lv?(b.upper==="floor"?"План 2-го этажа":"План антресоли")+", отм. +"+fmt(b.mz,3):"План 1-го этажа, отм. 0,000"}</text>`;
    body+=`<g transform='translate(${pad} ${y+.8})'>${planMarkup(lv,{export:true})}</g>`;
    // экспликация справа
    const g=explRows()[lv]; let ty=y+.9; body+=`<text x='${b.w+pad+.8}' y='${ty}' font-size='.32' font-weight='700'>Экспликация</text>`;
    for(const r of g.rooms){ ty+=.42; body+=`<text x='${b.w+pad+.8}' y='${ty}' font-size='.27'>${r.num} ${esc(r.name.slice(0,34))}</text><text x='${W-.5}' y='${ty}' font-size='.27' text-anchor='end'>${m2(r.area)}</text>`; }
    y+=planH+gap; }
  const H=y; const s=`<svg xmlns='http://www.w3.org/2000/svg' width='${W*10}mm' height='${H*10}mm' viewBox='0 0 ${W} ${H}'>${css}<rect width='${W}' height='${H}' fill='#fff'/>${title}${body}<text x='${pad}' y='${H-.6}' font-size='.28' fill='#777'>Масштаб 1:100 при печати в натуральную величину. Подготовлено в «Планировщике офиса продаж».</text></svg>`;
  return s;
}

function csv(){ const rows=[["Уровень","№","Помещение","Категория","Ширина, м","Глубина, м","Площадь, м²","В составе другого"]];
  for(const g of explRows()) for(const r of g.rooms){ const it=byId(r.id); rows.push([g.lv?"Антресоль":"1 этаж",r.num,r.name,CAT[r.cat].n,fmt(it.w),fmt(it.h),fmt(r.area),r.sub?"да":""]); }
  return "﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n"); }
async function doExport(kind){
  const base=(S.name||"проект").replace(/[\\/:*?"<>|]+/g," ").trim();
  let data, filename;
  if(kind==="json"){ data=JSON.stringify(S,null,1); filename=base+".json"; }
  else if(kind==="svg"){ data=exportSVG(); filename=base+" — план.svg"; }
  else if(kind==="csv"){ data=csv(); filename=base+" — экспликация.csv"; }
  else if(kind==="brief"){ data=briefHTML(); filename=base+" — задание проектировщику.html"; }
  else if(kind==="png"){ if(!R3) return; draw3D(); data=await new Promise(r=>R3.renderer.domElement.toBlob(r,"image/png")); filename=base+" — 3D.png"; }
  if(!downloads){ // локальный запуск: обычное скачивание браузером
    const blob = data instanceof Blob ? data : new Blob([data],{type:filename.endsWith(".html")?"text/html":filename.endsWith(".svg")?"image/svg+xml":filename.endsWith(".csv")?"text/csv":"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.style.display="none"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); toast("Файл сохранён: "+filename); return; }
  try{ await downloads.save({filename,data}); toast("Файл передан на сохранение"); }catch(e){ if(e.code!=="declined") toast("Не удалось выгрузить: "+(e.message||e.code)); }
}

 * 1) Claude на компьютере (Desktop / Code) через MCP-сервер office-planner — как Blender MCP: живая синхронизация по SSE.
 * 2) Помощник прямо здесь (в claude.ai): текст → команды OfficeKB.OPS → план. */
const LIVE={base:null, es:null, client:"b"+uid(), pushT:null, applying:false, on:false};
function setLive(on){ LIVE.on=on; const b=$("#bClaude"); if(b){ b.classList.toggle("live",!!on); b.textContent=on?"● Claude":"Claude"; b.title=on?"Claude подключён: изменения синхронизируются":"Подключить Claude"; } }
async function livePing(base){ try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),1500); const r=await fetch(base+"/api/ping",{signal:c.signal}); clearTimeout(t); const j=await r.json(); return j&&j.name==="office-planner"; }catch(e){ return false; } }
async function liveFind(){ if(location.protocol.startsWith("http")&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&await livePing(location.origin)) return location.origin;
  for(let p=8765;p<=8775;p++){ const b="http://127.0.0.1:"+p; if(await livePing(b)) return b; } return null; }
function liveConnect(base, pushFirst){
  if(LIVE.es) LIVE.es.close(); LIVE.base=base;
  const start=()=>{ const es=LIVE.es=new EventSource(base+"/api/events?client="+LIVE.client);
    es.addEventListener("state",e=>{ const m=JSON.parse(e.data); setLive(true); if(m.src===LIVE.client) return;
      if(JSON.stringify(m.project)===JSON.stringify(S)) return;
      LIVE.applying=true; try{ pushUndo(); S=m.project; if(sel&&!byId(sel)) sel=null; if(level===1&&!S.items.some(i=>i.lv===1)) level=0; render(); scheduleSave(); }finally{ LIVE.applying=false; }
      if(m.src!=="server") setStatus("Claude изменил план · "+new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit",second:"2-digit"})); });
    es.addEventListener("render",async e=>{ const m=JSON.parse(e.data); let png=null; try{ png=await snapshotPNG(m); }catch(err){ console.warn(err); }
      fetch(base+"/api/render",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({req:m.req,png})}).catch(()=>{}); });
    es.onerror=()=>setLive(false); };
  if(pushFirst) fetch(base+"/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({client:LIVE.client,project:S})}).then(start,start); else start();
}
function livePush(){ if(!LIVE.base||LIVE.applying||!LIVE.on) return; clearTimeout(LIVE.pushT);
  LIVE.pushT=setTimeout(()=>fetch(LIVE.base+"/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({client:LIVE.client,project:S})}).catch(()=>setLive(false)),300); }
// картинка плана для Claude: 2D — лист с экспликацией, 3D — снимок сцены
async function snapshotPNG(m){
  if(m.view==="3d"){ const was=view; setView("3d"); build3D(); if(!R3) return null; resize3D(); camReset(m.cam||"iso"); const url=R3.renderer.domElement.toDataURL("image/png"); if(was!=="3d") setView(was); return url; }
  const svgTxt=exportSVG(), vb=svgTxt.match(/viewBox='0 0 ([\d.]+) ([\d.]+)'/); const W=+vb[1], H=+vb[2], px=Math.min(1800, Math.max(1100, W*32)), sc=px/W;
  const img=new Image(); const url=URL.createObjectURL(new Blob([svgTxt],{type:"image/svg+xml"}));
  await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; });
  const c=document.createElement("canvas"); c.width=Math.round(W*sc); c.height=Math.round(H*sc); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/png");
}

const AI_SYS=()=>`Ты — архитектор-планировщик офисов продаж девелопера и управляешь «Планировщиком офиса продаж» командами.
Координаты в метрах: X вдоль дороги (0 — левый торец), Y вглубь (0 — глухая задняя стена, Y=${S.b.d} — фасад с витражом и входом). Наружные стены 0,3 м.
Логика: публичная зона у витража и входа (тамбур, ресепшен видно от входа, ожидание, макет, кофе, детская); вдоль глухой стены — кабинеты менеджеров 3,0×3,2 (стекло в зал), переговорные 4,5×3,2; сделочная/VIP, ипотека ближе к служебному блоку; служебные (с/у, кухня, КУИ, щитовая) в торце; бэк-офис — в торце или на антресоли (lv 1). Клиент не ходит через служебные. Проходы ≥ 1,5 м, ось входа свободна. Не накладывай помещения друг на друга (кроме зон sub внутри зала).
Команды (массив ops, выполняются по порядку):
{"op":"add_room","name":"Кабинет менеджера","x":..,"y":..,"w":3,"h":3.2,"lv":0,"border":"none|wall|glass","furnish":true} — тип и мебель по названию; без x/y место найдётся само (near: facade|back|left|right|center)
{"op":"update","id":"<id или название>","x":..,"y":..,"w":..,"h":..,"dx":..,"dy":..,"new_name":"..","border":"..","color":"#RRGGBB","rot":90} — помещение двигается с мебелью
{"op":"delete","id":"<id или название>"}
{"op":"add_item","k":"<ключ>","x":..,"y":..,"rot":0,"room":"<помещение>","count":1,"dir":"x|y"} — ключи: ${OfficeKB.FURN.filter(f=>!/Конструкции/.test(f[2])).map(f=>f[0]+" "+f[3]+"×"+f[4]).join(", ")}
{"op":"furnish","room":"<помещение>"} — расставить мебель по типу; {"op":"clear","room":".."}
{"op":"add_door","room":"..","side":"n|s|e|w","width":0.9}; {"op":"add_wall","kind":"part|glass|block|rail","x1":..,"y1":..,"x2":..,"y2":..}
{"op":"generate","pkg":"S|M|L","area":м²} — собрать офис заново по пакету (S до 150, M 200–320, L 350–600 м²); {"op":"building","w":..,"d":..,"h":..}
Верни ТОЛЬКО JSON: {"say":"коротко по-русски, что сделал и что посоветуешь","ops":[...]}. Если просьба непонятна или невыполнима — ops пустой, say с вопросом.`;
