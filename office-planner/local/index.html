<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Планировщик офиса продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: инструментальная панель сверху, библиотека слева, чертёж по центру, свойства справа. Палитра — чертёжная калька + синий карандаш. */
:root{
  --bg:#f2f2f7; --panel:#f9f9fb; --paper:#ffffff; --ink:#1c1c1e; --muted:#8e8e93; --line:rgba(60,60,67,.14);
  --accent:#007aff; --accent-soft:rgba(0,122,255,.11); --warn:#ff3b30; --ok:#34c759; --orange:#ff9500;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08); --glassbg:rgba(249,249,251,.78); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 10px 40px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06); --r:12px; --r-sm:9px;
  --grid:#eef0f3; --grid-major:#dfe3e8; --wall:#2c2c2e; --glass:#8fc9f2; --glass-edge:#0a84ff; --dim:#e5484d; --sel:#007aff;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif; --font-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1c1c1e; --paper:#161618; --ink:#f5f5f7; --muted:#8e8e93; --line:rgba(84,84,88,.45);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18); --warn:#ff453a; --ok:#30d158; --orange:#ff9f0a;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16); --glassbg:rgba(28,28,30,.78); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --grid:#202024; --grid-major:#2c2c31; --wall:#e5e5ea; --glass:#3f7fb0; --glass-edge:#64b5ff; --dim:#ff6961; --sel:#0a84ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --paper:#161618; --ink:#f5f5f7; --muted:#8e8e93; --line:rgba(84,84,88,.45);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18); --warn:#ff453a; --ok:#30d158; --orange:#ff9f0a;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16); --glassbg:rgba(28,28,30,.78); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --grid:#202024; --grid-major:#2c2c31; --wall:#e5e5ea; --glass:#3f7fb0; --glass-edge:#64b5ff; --dim:#ff6961; --sel:#0a84ff; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:250px 1fr 310px;grid-template-areas:"top top top" "lib main side"}
.top{grid-area:top;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top>*{flex:0 0 auto} .top .status{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
@media (max-width:1300px){ .brand{font-size:0;gap:0} .top .status{max-width:130px} }
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand i{display:inline-block;width:18px;height:18px;border:2px solid var(--accent);border-radius:2px;position:relative}
.brand i:after{content:"";position:absolute;left:5px;top:-2px;width:2px;height:10px;background:var(--accent)}
.pname{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;min-width:110px;max-width:240px;flex:0 1 200px!important;font-weight:600;text-overflow:ellipsis}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--paper);outline:none}
.grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.grp button{border:0;background:transparent;padding:6px 10px;cursor:pointer;white-space:nowrap}
.grp button+button{border-left:1px solid var(--line)}
.grp button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cta{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));border-color:var(--accent);color:#fff;font-weight:700;padding:7px 16px 7px 12px;border-radius:10px;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 45%,transparent);display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.btn.cta .plus{font-size:16px;line-height:1;font-weight:800}
.btn.cta:hover{transform:translateY(-1px);box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.btn.cta.big{font-size:15px;padding:11px 22px 11px 18px}
.btn.cta.pulse{animation:ctaPulse 1.6s ease-out 3}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media (max-width:900px){ #bWizard .lbl{display:none} #bWizard{padding:7px 10px} }
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty .ebox{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.empty .ebox b{font-size:17px}.empty .ebox p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}
.btn.danger{color:var(--warn)}
.btn:focus-visible,.grp button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
#bClaude.live{border-color:var(--ok);color:var(--ok);font-weight:600}
.ailog{margin:6px 0;padding-left:18px;font-size:12px}.ailog li.bad{color:var(--warn)}
.status{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib{grid-area:lib;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.lib .search{padding:10px 12px;border-bottom:1px solid var(--line)}
.lib .search input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.lib .list{overflow:auto;padding:4px 10px 16px;flex:1}
.lib h4{margin:14px 2px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px;cursor:grab;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card svg{width:100%;height:38px;display:block}
.card b{font-weight:500;font-size:11.5px;line-height:1.2}
.card small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.main{grid-area:main;position:relative;min-width:0;min-height:0;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:default}
#plan.pan{cursor:grab}#plan.panning{cursor:grabbing}#plan.draw{cursor:crosshair}
#three{position:absolute;inset:0}
.hud{position:absolute;left:12px;right:180px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none} .hud>*{pointer-events:auto}
.hud .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:8px;font-size:12px;max-width:90%;text-align:center}
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{overflow:auto;padding:12px 14px 24px;flex:1;min-height:0}
.pane h3{margin:2px 0 10px;font-size:15px}
.pane h5{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.one{grid-template-columns:1fr}
.row.four{grid-template-columns:repeat(4,1fr)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:13px;min-width:0;width:100%}
label.f input[type=number]{font-family:var(--font-mono);font-size:12px}
label.f input[type=color]{padding:2px;height:32px}
label.c{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.sw button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button:focus-visible{outline:2px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
table.ex{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.ex th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);padding:5px 4px}
table.ex td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
table.ex td.n{text-align:right;font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
table.ex tr.tot td{font-weight:700;border-bottom:0}
table.ex tr.sub td{color:var(--muted)}
table.ex tr:hover td{background:var(--accent-soft);cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-family:var(--font-mono);font-size:16px;font-weight:600}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:18px}
.dlg h3{margin:0 0 12px}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.pitem div{flex:1;min-width:0}
.pitem small{color:var(--muted);display:block}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;font-size:12.5px;z-index:30}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper)}
.chk{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.chk.red{border-color:var(--warn);color:var(--warn)} .chk.ok{color:var(--ok)}
.lvl{display:inline-block;min-width:54px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:6px;text-align:center}
.lvl.red{background:#f6dcd8;color:#a3342a} .lvl.yellow{background:#f6e8cc;color:#8a5a12} .lvl.info{background:var(--accent-soft);color:var(--accent)} .lvl.ok{background:#dcefe2;color:#2e7d4f} .lvl.advice{background:#ece6f7;color:#5b3d9e}
.checks li{margin:6px 0;font-size:12.5px;line-height:1.4;cursor:pointer} .checks small{color:var(--muted);display:block;margin-left:62px}
.dlg.wiz{max-width:680px} .fitbar{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--paper);font-size:12.5px}
.fitbar b{font-family:var(--font-mono)} .fitbar.bad{border-color:var(--warn)} .fitbar.good{border-color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 10px}
.aibox{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0 4px;background:var(--accent-soft)}
.aibox textarea{width:100%;min-height:58px;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.selbar{position:absolute;z-index:5;display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.selbar button{width:32px;height:30px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:16px;color:var(--ink)}
.selbar button:hover{background:var(--accent-soft)} .selbar button.danger:hover{background:#f6dcd2}
.selbar select{height:30px;max-width:180px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);font-size:12px;padding:0 4px}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:4}
.zoombar button{width:36px;height:34px;border:0;background:transparent;cursor:pointer;font-size:17px;color:var(--ink)} .zoombar button:hover{background:var(--accent-soft)}
.ctx{position:fixed;z-index:40;min-width:220px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.ctx button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px}
.ctx button:hover{background:var(--accent-soft)} .ctx button span{width:18px;text-align:center} .ctx button.danger{color:var(--warn)}
.ctxh{font-size:11px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:8px} .pv figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pv img,.pv svg{width:100%;height:120px;object-fit:contain} .pv figcaption{font-size:11px;color:#777}
.pv svg{--paper:#fff;--ink:#222;--muted:#777;--wall:#3a3f3b;--glass:#9fd3f0;--glass-edge:#2a78b8}
.libtip{position:fixed;z-index:30;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:none;display:flex;flex-direction:column;gap:6px}
.libtip small{color:var(--muted);font-size:11.5px;line-height:1.4}
details.lg{border-bottom:1px solid var(--line)} details.lg>summary{cursor:pointer;list-style:none;padding:10px 12px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
details.lg>summary::-webkit-details-marker{display:none} details.lg>summary::before{content:"▸";margin-right:6px} details.lg[open]>summary::before{content:"▾"}
details.lg>summary span{font-weight:400}
table.keys{width:100%;border-collapse:collapse;font-size:13px} table.keys td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top} table.keys td:first-child{white-space:nowrap;color:var(--muted);padding-right:14px}
.nv{max-width:1080px}
.vcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.vc{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);font:inherit}
.vc.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.vc .vt{background:#fff;border:1px solid var(--line);border-radius:8px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vc .vt svg{width:100%;height:100%}
.vc .vh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.vc .vh b{font-size:16px}
.vc small{color:var(--muted)} .vc ul{margin:2px 0 0;padding-left:16px;font-size:12.5px;line-height:1.45}
.chip.good{color:var(--ok);border-color:var(--ok)} .chip.warn{color:var(--warn);border-color:var(--warn)}
.nvsum{align-self:end;font-size:13px}.nvlog{margin-top:8px;font-size:12.5px}.nvlog ol{margin:4px 0;padding-left:18px}
@media (max-width:820px){.vcards{grid-template-columns:1fr}}
@media (max-width:700px){ .hud .chip:not(.chk){display:none} .hud{top:8px;bottom:auto;left:8px;right:auto} .chk{white-space:nowrap} .selbar select{max-width:110px} }
.pks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pk b{font-size:15px} .pk span{font-family:var(--font-mono);font-size:12px;color:var(--accent)} .pk small{font-size:11.5px;color:var(--muted);line-height:1.35}
.pk.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.edt input,.edt select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font-size:12px}
@media (max-width:640px){.pks{grid-template-columns:1fr}}
/* plan styles */
.nss{vector-effect:non-scaling-stroke}
#plan text{font-family:var(--font-ui);letter-spacing:0;text-rendering:geometricPrecision}
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 62vh auto;grid-template-areas:"top" "main" "side"}
  .side{border:0;border-top:1px solid var(--line);max-height:none}
  /* библиотека на телефоне — выезжающая снизу панель */
  .lib{position:fixed;left:0;right:0;bottom:0;height:72vh;z-index:35;border:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
  .lib.open{transform:none}
  .lib:before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--fill);margin:8px auto 0;flex:0 0 auto}
  .libfab{display:inline-flex!important}
  .lib .list{max-height:none}
  .pane{max-height:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
/* ============ iOS-слой: стекло, сегменты, пилюли, мягкие тени ============ */
body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em;font-size:13.5px}
.top{background:var(--glassbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:9px 14px;gap:10px;z-index:10;position:relative}
.brand{font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand i{width:22px;height:22px;border:0;border-radius:7px;background:linear-gradient(145deg,#5ac8fa,var(--accent));box-shadow:0 2px 6px rgba(0,122,255,.35)}
.brand i:after{left:6px;top:5px;width:10px;height:12px;background:transparent;border:2px solid #fff;border-radius:2px;border-top-width:2px}

    // вход: доля длины фасада от левого торца (R24 060: В1 ≈ 0,7 от служебного торца, В2 — у сделочного узла, В3 — по центру); сетка колонн — шаг, м

/* ============================================================ символы мебели (локальные координаты 0..w, 0..h) */
function sym(it, forCard){
  const f=FK[it.k]||{d:"rect"}, w=it.w, h=it.h, k="class='nss'";
  const st = "fill='var(--paper)' stroke='var(--ink)' stroke-width='0.8' "+k;
  const lt = "fill='none' stroke='var(--ink)' stroke-width='0.5' "+k;
  const R=(x,y,ww,hh,extra="")=>`<rect x='${x}' y='${y}' width='${Math.max(ww,0)}' height='${Math.max(hh,0)}' ${extra||st}/>`;
  const chair=(cx,cy,a=.45,dir=0)=>`<g transform='translate(${cx} ${cy}) rotate(${dir})'>${R(-a/2,-a/2,a,a)}${R(-a/2,-a/2,a,a*.2,"fill='var(--ink)' opacity='.55'")}</g>`;
  switch(f.d){
    case "door": { const lf=w, b=Math.min(.3,h);
      return `${R(0,0,w,b,"fill='var(--paper)' stroke='none'")}<line x1='0' y1='${b}' x2='0' y2='${b+lf}' stroke='var(--ink)' stroke-width='1.6' ${k}/><path d='M ${lf} ${b} A ${lf} ${lf} 0 0 1 0 ${b+lf}' ${lt}/>`; }
    case "door2": { const lf=w/2, b=.3;
      return `${R(0,0,w,b,"fill='var(--paper)' stroke='none'")}<line x1='0' y1='${b}' x2='0' y2='${b+lf}' stroke='var(--ink)' stroke-width='1.6' ${k}/><line x1='${w}' y1='${b}' x2='${w}' y2='${b+lf}' stroke='var(--ink)' stroke-width='1.6' ${k}/><path d='M ${lf} ${b} A ${lf} ${lf} 0 0 1 0 ${b+lf}' ${lt}/><path d='M ${lf} ${b} A ${lf} ${lf} 0 0 0 ${w} ${b+lf}' ${lt}/>`; }
    case "slide": return `${R(0,0,w,h,"fill='var(--paper)' stroke='none'")}${R(-.05,h*.55,w*.6,.06)}<line x1='${w*.2}' y1='${h*.85}' x2='${w*.8}' y2='${h*.85}' ${lt}/>`;
    case "auto": return `${R(0,0,w,h,"fill='var(--paper)' stroke='none'")}${R(0,h*.5,w*.48,.06)}${R(w*.52,h*.5,w*.48,.06)}<path d='M ${w*.3} ${h*.2} L ${w*.1} ${h*.2} M ${w*.7} ${h*.2} L ${w*.9} ${h*.2}' ${lt}/>`;
    case "win": return `${R(0,0,w,h,"fill='var(--glass)' stroke='var(--glass-edge)' stroke-width='.6' "+k)}<line x1='0' y1='${h/2}' x2='${w}' y2='${h/2}' stroke='var(--glass-edge)' stroke-width='.5' ${k}/>`;
    case "chair": return chair(w/2,h/2,Math.min(w,h));
    case "stool": return `<circle cx='${w/2}' cy='${h/2}' r='${Math.min(w,h)/2}' ${st}/>`;
    case "arm": return `${R(0,0,w,h)}${R(0,0,w,h*.22,"fill='var(--ink)' opacity='.3'")}${R(0,0,w*.15,h)}${R(w*.85,0,w*.15,h)}`;
    case "sofa": { const n=Math.max(2,Math.round(w/.7)); let s=R(0,0,w,h)+R(0,0,w,h*.25,"fill='var(--ink)' opacity='.25'");
      for(let i=1;i<n;i++) s+=`<line x1='${w*i/n}' y1='${h*.25}' x2='${w*i/n}' y2='${h}' ${lt}/>`; return s; }
    case "lounge": { let s=R(.3,1.15,1.6,.65);

function itemTf(it){ const a=aabb(it), r=it.rot||0;

/* ============================================================ разметка плана (строка SVG, единицы — метры) */
function numbering(){
  const map={}; for(const lv of [0,1]){ let n=1;
    S.items.filter(i=>i.t==="room"&&i.lv===lv&&!i.sub).sort((a,b)=>(a.y-b.y)||(a.x-b.x)).forEach(r=>map[r.id]=(lv?"А":"")+(n++)); }
  return map;
}
function wallRect(wl){ const dx=wl.x2-wl.x1, dy=wl.y2-wl.y1, L=Math.hypot(dx,dy)||1e-6, nx=-dy/L*wl.th/2, ny=dx/L*wl.th/2;
  return `${wl.x1+nx},${wl.y1+ny} ${wl.x2+nx},${wl.y2+ny} ${wl.x2-nx},${wl.y2-ny} ${wl.x1-nx},${wl.y1-ny}`; }
function drawWall(wl, ghost, interactive){
  const W=WALLS[wl.kind]; const pts=wallRect(wl);
  if(ghost) return `<polygon points='${pts}' fill='none' stroke='var(--muted)' stroke-width='.6' opacity='.5' class='nss'/>`;
  let s = W.glass
    ? `<polygon points='${pts}' fill='var(--glass)' stroke='var(--glass-edge)' stroke-width='.7' class='nss'/><line x1='${wl.x1}' y1='${wl.y1}' x2='${wl.x2}' y2='${wl.y2}' stroke='var(--glass-edge)' stroke-width='.6' class='nss' ${wl.kind==="rail"?"stroke-dasharray='4 2'":""}/>`
    : `<polygon points='${pts}' fill='${wl.kind==="part"?"var(--paper)":"var(--wall)"}' stroke='var(--wall)' stroke-width='.8' class='nss'/>`;
  if(interactive) s += `<line x1='${wl.x1}' y1='${wl.y1}' x2='${wl.x2}' y2='${wl.y2}' stroke='transparent' stroke-width='12' class='nss' data-id='${wl.id}' style='cursor:move'/>`;
  return s;
}
function planMarkup(lv, opt={}){
  const {b}=S, nums=numbering(), out=[], exp=!!opt.export;
  const mine = S.items.filter(i=>i.lv===lv), other = S.items.filter(i=>i.lv!==lv);
  out.push(`<rect x='0' y='0' width='${b.w}' height='${b.d}' fill='${exp?"#fff":"var(--paper)"}' stroke='none'/>`);
  if(lv===1 && !exp) out.push(`<rect x='0' y='0' width='${b.w}' height='${b.d}' fill='url(#hatch)' opacity='.6'/>`);
  // призрак другого уровня
  if(!exp || lv===1) for(const it of other){
    if(it.t==="room") out.push(`<rect x='${it.x}' y='${it.y}' width='${it.w}' height='${it.h}' fill='none' stroke='var(--muted)' stroke-width='.6' stroke-dasharray='3 3' opacity='.55' class='nss'/>`);
    else if(it.t==="wall") out.push(drawWall(it,true));
    else if(lv===1) out.push(`<g transform='${itemTf(it)}' opacity='.18'>${sym(it)}</g>`);
  }
  const rooms = mine.filter(i=>i.t==="room");
  const ordered = [...rooms.filter(r=>!r.sub), ...rooms.filter(r=>r.sub)];
  for(const r of ordered){
    out.push(`<rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='${r.sub?hx(r.color,.55):r.color}' ${r.sub?"stroke='#8a7d62' stroke-width='.8' stroke-dasharray='5 3' class='nss'":"stroke='none'"} ${exp?"":`data-id='${r.id}' style='cursor:move'`}/>`);
  }
  for(const r of rooms){ if(r.border==="none"||r.sub) continue;
    if(r.nowall&&r.nowall.length){ // стороны без стены (например, у криволинейного фасада)
      const gl=r.border==="glass", E={n:[r.x,r.y,r.x+r.w,r.y],s:[r.x,r.y+r.h,r.x+r.w,r.y+r.h],w:[r.x,r.y,r.x,r.y+r.h],e:[r.x+r.w,r.y,r.x+r.w,r.y+r.h]};
      for(const k of "nsew") if(!r.nowall.includes(k)){ const [a,b2,c,d]=E[k]; out.push(`<line x1='${a}' y1='${b2}' x2='${c}' y2='${d}' stroke='${gl?"var(--glass-edge)":"var(--wall)"}' stroke-width='${gl?.09:.12}' pointer-events='none'/>`); }
      continue; }
    if(r.border==="wall") out.push(`<rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='none' stroke='var(--wall)' stroke-width='.12' pointer-events='none'/>`);
    else out.push(`<rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='none' stroke='var(--glass-edge)' stroke-width='.09' pointer-events='none'/><rect x='${r.x}' y='${r.y}' width='${r.w}' height='${r.h}' fill='none' stroke='var(--glass)' stroke-width='.04' pointer-events='none'/>`);
  }
  for(const wl of mine.filter(i=>i.t==="wall")) out.push(drawWall(wl,false,!exp));
  for(const it of mine.filter(i=>i.t==="item")){
    const lbl = it.label ? `<text x='${aabb(it).x+aabb(it).w/2}' y='${aabb(it).y+aabb(it).h+.28}' font-size='.22' text-anchor='middle' fill='var(--muted)' pointer-events='none'>${esc(it.label)}</text>`:"";
    out.push(`<g transform='${itemTf(it)}' ${exp?"":`data-id='${it.id}' style='cursor:move'`}>${sym(it)}<rect x='0' y='0' width='${it.w}' height='${it.h}' fill='transparent' stroke='none'/></g>${lbl}`);
  }
  // участки вне контура здания (криволинейный фасад): закрываем фоном
  for(const poly of (b.cut&&b.cut[lv])||[]) out.push(`<polygon points='${poly.map(p=>p.join(",")).join(" ")}' fill='${exp?"#fff":"var(--paper)"}' stroke='none' pointer-events='none'/>`);
  // наружные стены здания
  const t=.3, fr=b.front;
  out.push(`<g pointer-events='none'>`);
  out.push(`<rect x='0' y='0' width='${b.w}' height='${t}' fill='var(--wall)'/><rect x='0' y='0' width='${t}' height='${b.d}' fill='var(--wall)'/><rect x='${b.w-t}' y='0' width='${t}' height='${b.d}' fill='var(--wall)'/>`);
  if(fr==="vitrage"){ out.push(`<rect x='${t}' y='${b.d-t}' width='${b.w-2*t}' height='${t}' fill='var(--glass)' stroke='var(--glass-edge)' stroke-width='.6' class='nss'/><line x1='${t}' y1='${b.d-t/2}' x2='${b.w-t}' y2='${b.d-t/2}' stroke='var(--glass-edge)' stroke-width='.6' class='nss'/>`);
    for(let x=0;x<=b.w+1e-6;x+=5){ const cx=Math.min(Math.max(x,.2),b.w-.2); out.push(`<rect x='${cx-.2}' y='${b.d-.4}' width='.4' height='.4' fill='var(--wall)'/>`); } }
  else if(fr!=="custom") out.push(`<rect x='0' y='${b.d-t}' width='${b.w}' height='${t}' fill='var(--wall)'/>`);
  out.push(`</g>`);
  // подписи помещений
  for(const r of ordered){
    const pxMin = exp ? 0 : 9/V.s;   // на экране подпись не мельче ~9 px, если помещение позволяет
    let fs = Math.max(.12, Math.min(Math.max(.34, pxMin), r.w/10, r.h/4));
    const cx=r.x+r.w/2, cy=r.y+r.h/2, num=nums[r.id];
    const area = r.w*r.h;
    const name = r.sub ? r.name : `${num}. ${r.name}`;
    let words = wrapText(name, r.w, fs);
    // подпись вписывается в помещение: уменьшаем шрифт, в крошечных — только номер и площадь
    for(let g=0; g<6 && ((words.length+1)*fs*1.2 > r.h*.9 || Math.max(...words.map(x=>x.length))*fs*.62 > r.w*.95); g++){ fs*=.85; words=wrapText(name, r.w, fs); }
    if(fs < .1 || (words.length+1)*fs*1.2 > r.h*.95){ fs=Math.max(.1,Math.min(.2,r.w/6,r.h/3)); words=[r.sub?"":String(num)].filter(Boolean); }
    let lines = [...words, `${m2(area)} м²`];
    if(!exp && fs*V.s < 6.5){ const f2=8/V.s; if(r.w > f2*2.4 && r.h > f2*1.6 && !r.sub){ fs=f2; lines=[String(num)]; } else continue; }   // мелко на экране — только номер (или ничего)
    const y0 = cy - (lines.length-1)*fs*1.2/2;
    out.push(`<text font-size='${fs}' text-anchor='middle' fill='${exp?"#222":"var(--ink)"}' pointer-events='none' style='paint-order:stroke;stroke:${hx(r.color,.8)};stroke-width:${fs*.25}px'>`+
      lines.map((l,i)=>`<tspan x='${cx}' y='${y0+i*fs*1.2}' dominant-baseline='central' ${i===lines.length-1?"font-weight='600'":""}>${esc(l)}</tspan>`).join("")+`</text>`);
  }
  return out.join("");
}
function wrapText(s, w, fs){ const max=Math.max(4, Math.floor(w*.9/(fs*.62))); const words=s.split(" "); const lines=[]; let cur="";
  for(const wd of words){ if((cur+" "+wd).trim().length>max && cur){ lines.push(cur); cur=wd; } else cur=(cur+" "+wd).trim(); }
  if(cur) lines.push(cur); return lines.slice(0,3); }

/* ============================================================ размерные линии */
function dimLine(x1,y1,x2,y2,label,off=0){
  const s=V.s, ang=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(ang), ny=Math.cos(ang);
  const ox=nx*off, oy=ny*off, a=[x1+ox,y1+oy], b=[x2+ox,y2+oy], tk=6/s;
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2; let deg=ang*180/Math.PI; if(deg>90||deg<-90) deg+=180;
  const fs=12/s;
  return `<g pointer-events='none'><line x1='${a[0]}' y1='${a[1]}' x2='${b[0]}' y2='${b[1]}' stroke='var(--dim)' stroke-width='1' class='nss'/>`+
    [a,b].map(p=>`<line x1='${p[0]-tk}' y1='${p[1]+tk}' x2='${p[0]+tk}' y2='${p[1]-tk}' stroke='var(--dim)' stroke-width='1.4' class='nss'/>`).join("")+
    (off?`<line x1='${x1}' y1='${y1}' x2='${a[0]}' y2='${a[1]}' stroke='var(--dim)' stroke-width='.5' class='nss'/><line x1='${x2}' y1='${y2}' x2='${b[0]}' y2='${b[1]}' stroke='var(--dim)' stroke-width='.5' class='nss'/>`:"")+
    `<text x='${mx}' y='${my}' transform='rotate(${deg} ${mx} ${my}) translate(0 ${-5/s})' font-size='${fs}' text-anchor='middle' fill='var(--dim)' style='font-family:var(--font-mono);paint-order:stroke;stroke:var(--paper);stroke-width:${3/s}px'>${label}</text></g>`;
}
const mm = v => String(Math.round(v*1000)).replace(/\B(?=(\d{3})+(?!\d))/g," ");

async function listProjects(){

function exportSVG(){
  const b=S.b, pad=2.5, gap=4, lvls=S.items.some(i=>i.lv===1)?[0,1]:[0];
  const planH=b.d+pad*2, W=b.w+pad*2+14; let y=pad+1.2, body="";
  const css=`<style>:root{--paper:#fff;--ink:#222;--muted:#777;--wall:#3a3f3b;--glass:#9fd3f0;--glass-edge:#2a78b8;--dim:#b3392f;--grid:#eee;--grid-major:#ddd}.nss{vector-effect:non-scaling-stroke}text{font-family:Arial,sans-serif}</style>`;
  const title=`<text x='${pad}' y='1.3' font-size='.7' font-weight='700'>${esc(S.name)} — ${fmt(b.w,1)} × ${fmt(b.d,1)} м</text>`;
  for(const lv of lvls){ body+=`<text x='${pad}' y='${y}' font-size='.45' font-weight='700'>${lv?(b.upper==="floor"?"План 2-го этажа":"План антресоли")+", отм. +"+fmt(b.mz,3):"План 1-го этажа, отм. 0,000"}</text>`;
    body+=`<g transform='translate(${pad} ${y+.8})'>${planMarkup(lv,{export:true})}</g>`;
    // экспликация справа
    const g=explRows()[lv]; let ty=y+.9; body+=`<text x='${b.w+pad+.8}' y='${ty}' font-size='.32' font-weight='700'>Экспликация</text>`;
    for(const r of g.rooms){ ty+=.42; body+=`<text x='${b.w+pad+.8}' y='${ty}' font-size='.27'>${r.num} ${esc(r.name.slice(0,34))}</text><text x='${W-.5}' y='${ty}' font-size='.27' text-anchor='end'>${m2(r.area)}</text>`; }
    y+=planH+gap; }
  const H=y; const s=`<svg xmlns='http://www.w3.org/2000/svg' width='${W*10}mm' height='${H*10}mm' viewBox='0 0 ${W} ${H}'>${css}<rect width='${W}' height='${H}' fill='#fff'/>${title}${body}<text x='${pad}' y='${H-.6}' font-size='.28' fill='#777'>Масштаб 1:100 при печати в натуральную величину. Подготовлено в «Планировщике офиса продаж».</text></svg>`;
  return s;
}

// лист презентации: план с экспликацией сверху, изометрия снизу
async function sheetPNG(){
  const plan=await snapshotPNG({view:"2d"}), iso=await snapshotPNG({view:"3d",cam:"iso"});
  const load=u=>new Promise((ok,no)=>{ if(!u) return ok(null); const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=u; });
  const [a,b]=await Promise.all([load(plan),load(iso)]); const W=1800, pad=40;
  const ha=a?Math.round(a.height*(W-2*pad)/a.width):0, hb=b?Math.round(b.height*(W-2*pad)/b.width):0;
  const c=document.createElement("canvas"); c.width=W; c.height=pad*2+60+ha+(b?50+hb:0); const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.fillStyle="#222"; g.font="600 30px Arial"; g.fillText(S.name||"Офис продаж",pad,pad+26);
  g.font="16px Arial"; g.fillStyle="#666"; g.fillText(`${fmt(S.b.w,1)} × ${fmt(S.b.d,1)} м · высота ${fmt(S.b.h,1)} м · ${new Date().toLocaleDateString("ru")}`,pad,pad+52);
  let y=pad+70; if(a){ g.drawImage(a,pad,y,W-2*pad,ha); y+=ha+20; }
  if(b){ g.fillStyle="#222"; g.font="600 20px Arial"; g.fillText("Изометрия",pad,y+18); g.drawImage(b,pad,y+30,W-2*pad,hb); }
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function doExport(kind){
  const base=(S.name||"проект").replace(/[\\/:*?"<>|]+/g," ").trim();
  let data, filename;
  if(kind==="json"){ data=JSON.stringify(S,null,1); filename=base+".json"; }
  else if(kind==="svg"){ data=exportSVG(); filename=base+" — план.svg"; }
  else if(kind==="csv"){ data=csv(); filename=base+" — экспликация.csv"; }
  else if(kind==="brief"){ data=briefHTML(); filename=base+" — задание проектировщику.html"; }
  else if(kind==="sheet"){ toast("Собираю лист: план и изометрия…"); data=await sheetPNG(); filename=base+" — план и изометрия.png"; }
  else if(kind==="png"){ if(!R3) return; draw3D(); data=await new Promise(r=>R3.renderer.domElement.toBlob(r,"image/png")); filename=base+" — 3D.png"; }
  if(!downloads){ // локальный запуск: обычное скачивание браузером
    const blob = data instanceof Blob ? data : new Blob([data],{type:filename.endsWith(".html")?"text/html":filename.endsWith(".svg")?"image/svg+xml":filename.endsWith(".csv")?"text/csv":"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.style.display="none"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); toast("Файл сохранён: "+filename); return; }
  try{ await downloads.save({filename,data}); toast("Файл передан на сохранение"); }catch(e){ if(e.code!=="declined") toast("Не удалось выгрузить: "+(e.message||e.code)); }
}

  const col=["#2a78b8","#2a78b8","#3c9a5f","#d08a1a","#7a56c2","#c2565e","#a8784e"]; let o="";
  for(const s of J.stages){ if(!s.pts||s.pts.length<2) continue; const c=s.transit||s.unreachable?"#c0392b":col[(s.n-1)%col.length];
    o+=`<polyline points="${s.pts.map(p=>p.x.toFixed(2)+","+p.y.toFixed(2)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" class="nss" opacity=".8" pointer-events="none"/>`; }
  for(const s of J.stages){ if(!s.room) continue; const r=s.room, x=s.n===1?J.entrance.px:r.x+r.w/2, y=s.n===1?J.entrance.py-0.6:r.y+r.h/2, c=s.transit||s.unreachable?"#c0392b":col[(s.n-1)%col.length];
    o+=`<g pointer-events="none"><circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r=".38" fill="${c}" stroke="#fff" stroke-width=".07"/><text x="${x.toFixed(2)}" y="${(y+0.01).toFixed(2)}" font-size=".42" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${s.n}</text></g>`; }
  return o; }
$("#pane").addEventListener("change",e=>{ if(e.target.id==="cjmShow"){ SHOWPATH=e.target.checked; try{ localStorage.setItem("op_path",SHOWPATH?"1":"0"); }catch(_){} render(); } });
function programHTML(){ if(!S.program||!S.program.length) return `<h5>Программа помещений</h5><p class="note">Программы нет. Нажмите «Новый проект → Настроить программу» — он соберёт список помещений с целевыми площадями и разложит их по зонам.</p>`;
  const f=OfficeKB.programFact(S), st={ok:"ok",yellow:"yellow",red:"red",info:"info"}, nm={ok:"есть",yellow:"частично",red:"нет",info:"больше"};
  return `<h5>Программа: цель / факт</h5><table class="ex"><tr><th>Помещение</th><th style="text-align:right">шт.</th><th style="text-align:right">м² факт / цель</th></tr>`+
    f.map(r=>`<tr title="${esc(r.rule||"")}"><td><span class="lvl ${st[r.state]}">${nm[r.state]}</span>${esc(r.name)}</td><td class="n">${r.placed}/${r.n}</td><td class="n">${m2(r.factArea)} / ${m2(r.targetArea)}</td></tr>`).join("")+`</table>`; }
/* ---------- пакеты: хранение настроек компании ---------- */
const PKG_LS="op.packages";
function loadPackages(obj){ try{ if(obj&&typeof obj==="object") for(const k of ["S","M","L"]) if(obj[k]&&Array.isArray(obj[k].rows)) OfficeKB.PACKAGES[k]=obj[k]; }catch(e){} }
try{ loadPackages(JSON.parse(localStorage.getItem(PKG_LS)||"null")); }catch(e){}
async function savePackages(){ const data=JSON.parse(JSON.stringify(OfficeKB.PACKAGES));
  try{ localStorage.setItem(PKG_LS,JSON.stringify(data)); }catch(e){}
  try{ if(store) await store.collection("settings").doc("packages").set({json:JSON.stringify(data),updatedAt:Date.now()}); }catch(e){} }
async function syncPackagesFromStore(){ try{ if(!store) return; const d=await store.collection("settings").doc("packages").get(); if(d.exists){ loadPackages(JSON.parse(d.data().json)); } }catch(e){} }

/* ---------- мастер: пакет → площадь → программа → план ---------- */
function wizardDialog(){
  const prev=(S.meta&&S.meta.params)||{};
  const st={ pkg: prev.pkg||"M", area: prev.area||null, opts: Object.assign({},prev.opts||{}), counts: Object.assign({},prev.counts||{}), autoB: true,
    w:S.b.w, d:S.b.d, h:S.b.h, mezz: prev.mezz||"auto", name: prev.name||"Офис продаж" };
  if(!st.area){ st.area=OfficeKB.PACKAGES[st.pkg].A; }
  const m=document.createElement("div"); m.className="modal";
  const cards=()=>["S","M","L"].map(k=>{ const P=OfficeKB.PACKAGES[k]; return `<button class="pk ${st.pkg===k?"on":""}" data-pk="${k}"><b>${esc(P.name)}</b><span>${esc(P.sub)}</span><small>${esc(P.about||"")}</small></button>`; }).join("");
  m.innerHTML=`<div class="dlg wiz" role="dialog" aria-label="Мастер офиса продаж"><h3>Мастер офиса продаж</h3>
  <p class="note">Выберите пакет и площадь — список помещений пересчитается сам. Количество любого помещения можно поправить, лишнее — выключить. Правила пакетов меняются в «Редактировать пакеты».</p>
  ${sampleCap?`<div class="aibox"><label class="f" for="w_ai">Или опишите офис словами — ИИ заполнит поля
  <textarea id="w_ai" placeholder="Например: помещение 32 на 14 метров, потолок 6,5, восемь менеджеров, нужна касса и детская"></textarea></label>
  <div class="actions"><button class="btn" id="w_aiGo">Заполнить по описанию</button><span class="note" id="w_aiSt"></span></div></div>`:""}
  <div class="pks" id="w_pks">${cards()}</div>
  <div class="row four" style="margin-top:10px">
    <label class="f">Площадь офиса, м²<input id="w_area" type="number" step="5"></label>
    <label class="f">Длина вдоль дороги, м<input id="w_w" type="number" step=".1"></label>
    <label class="f">Глубина, м<input id="w_d" type="number" step=".1"></label>
    <label class="f">Высота, м<input id="w_h" type="number" step=".1"></label></div>
  <input id="w_rng" type="range" style="width:100%" aria-label="Площадь">
  <div class="row"><label class="f">Название<input id="w_name"></label><label class="f">Антресоль<select id="w_mezz"><option value="auto">Если высота ≥ 6,2 м</option><option value="yes">Да</option><option value="no">Нет</option></select></label></div>
  <label class="c"><input type="checkbox" id="w_autoB" checked> Подбирать размеры здания под площадь</label>
  <div class="fitbar" id="w_fit"></div>
  <h5>Программа помещений</h5><div id="w_prog" style="overflow-x:auto"></div>
  <div class="actions"><button class="btn primary" id="w_go">Создать план</button><button class="btn" id="w_edit">Редактировать пакеты…</button><button class="btn" id="w_cancel">Отмена</button><span class="note">Текущий проект сохранится в «Проекты».</span></div></div>`;
  document.body.appendChild(m);
  const $m=id=>m.querySelector("#"+id);
  const paramsOf=()=>({pkg:st.pkg, area:st.area, opts:st.opts, counts:st.counts, w:st.w, d:st.d, h:st.h, mezz:st.mezz, name:st.name});
  const syncInputs=()=>{ const P=OfficeKB.PACKAGES[st.pkg]; $m("w_area").value=st.area; $m("w_rng").min=P.min; $m("w_rng").max=P.max; $m("w_rng").step=5; $m("w_rng").value=st.area;
    if(st.autoB){ const b=OfficeKB.suggestBuilding(st.pkg,st.area); st.w=b.w; st.d=b.d; st.h=b.h; }
    $m("w_w").value=st.w; $m("w_d").value=st.d; $m("w_h").value=st.h; $m("w_name").value=st.name; $m("w_mezz").value=st.mezz; $m("w_autoB").checked=st.autoB; };
  const draw=()=>{ let pp; const el=$m("w_fit");
    try{ pp=OfficeKB.packageProgram(st.pkg,st.area,st.opts,st.counts); }catch(err){ el.className="fitbar bad"; el.textContent="Ошибка в правилах пакета: "+err.message; $m("w_prog").innerHTML=""; return; }
    const have=(st.w-0.6)*(st.d-0.6), P=OfficeKB.PACKAGES[st.pkg];
    const ok=have>=pp.need; el.className="fitbar "+(ok?"good":"bad");
    el.innerHTML=`${esc(P.name)}: ${pp.vars.M} менеджеров, бэк-офис ${pp.vars.B}, ожидание ${pp.vars.seats} мест, макет ${pp.maket.replace("x","×")}.<br>Помещения <b>${m2(pp.net)} м²</b> × ${String(pp.k).replace(".",",")} на проходы = <b>${m2(pp.need)} м²</b> · в здании ${fmt(st.w,1)}×${fmt(st.d,1)} м внутри стен <b>${m2(have)} м²</b> → ${ok?`<b style="color:var(--ok)">помещается</b>`:`<b style="color:var(--warn)">не хватает ${m2(pp.need-have)} м²</b>`}`;
    try{ const g=OfficeKB.generate(paramsOf()); el.innerHTML+=g.warnings.length?`<div style="margin-top:6px;color:var(--warn)">Черновик раскладки: ${g.warnings.map(esc).join(" ")}</div>`:`<div style="margin-top:6px;color:var(--ok)">Черновик раскладки: всё помещается.</div>`; }catch(err){}
    const on=new Set(pp.rows.map(r=>r.key)), zn=OfficeKB.ZONES;
    const rowsAll=P.rows.map(r=>{ const got=pp.rows.find(x=>x.key===r.key); return {def:r, got}; });
    $m("w_prog").innerHTML=`<table class="ex"><tr><th></th><th>Помещение</th><th>Зона</th><th style="text-align:right">шт.</th><th style="text-align:right">м² на 1</th><th style="text-align:right">м² всего</th></tr>`+
      rowsAll.map(({def,got})=>{ const opt=def.status&&def.status!=="обязательно"; const chk=opt?`<input type="checkbox" data-opt="${def.key}" ${got?"checked":""} aria-label="Включить ${esc(def.name)}">`:"";
        return `<tr class="${got?"":"sub"}" title="${esc(def.rule||"")}"><td>${chk}</td><td>${esc(def.name)}${opt?` <small>(${esc(def.status)})</small>`:""}</td><td><small>${esc(zn[def.zone]||def.zone)}</small></td>
        <td class="n">${got?`<input type="number" min="0" max="40" data-cnt="${def.key}" value="${got.n}" style="width:52px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font-family:var(--font-mono)">`:"—"}</td>
        <td class="n">${got?m2(got.area):"—"}</td><td class="n">${got?m2(got.n*got.area):"—"}</td></tr>`; }).join("")+
      `<tr class="tot"><td></td><td>Итого помещений</td><td></td><td></td><td></td><td class="n">${m2(pp.net)}</td></tr></table>`; };
  const refresh=()=>{ syncInputs(); draw(); };
  refresh();
  m.addEventListener("click",async e=>{ const t=e.target, pk=t.closest("[data-pk]");
    if(pk){ st.pkg=pk.dataset.pk; st.area=OfficeKB.PACKAGES[st.pkg].A; st.opts={}; st.counts={}; $m("w_pks").innerHTML=cards(); refresh(); return; }
    if(t===m||t.id==="w_cancel") m.remove();
    if(t.id==="w_edit"){ m.remove(); packageEditor(st.pkg); }
    if(t.id==="w_go"){ await flush(); undo.length=0; const r=OfficeKB.generate(paramsOf()); S=r.project; projectId=uid(); sel=null; level=0; redo.length=0;
      m.remove(); setView("2d"); fit(); commit(); tab="ex"; setTabs(); renderPane();
      toast(r.warnings.length?`План собран. Замечаний: ${r.warnings.length} — см. «Экспликация»`:"План собран по пакету"); }
    if(t.id==="w_aiGo"){ const txt=$m("w_ai").value.trim(), sEl=$m("w_aiSt"); if(!txt){ sEl.textContent="Напишите пару фраз об офисе."; return; }
      sEl.textContent="Разбираю описание…"; t.disabled=true;
      try{ const res=await sampleCap.json(`Ты помогаешь заполнить мастер планировки офиса продаж девелопера. Пакеты: S «Мини» 80–150 м², M «Стандарт» 200–320 м², L «Флагман» 350–600 м².
Верни ТОЛЬКО JSON: {"pkg":"S"|"M"|"L","area":число м² (площадь офиса),"w":длина вдоль дороги м,"d":глубина м,"h":высота м,"managers":число менеджеров,"name":строка}. Включай только поля, о которых есть сведения; если дана только площадь — выбери пакет по диапазону; если даны длина и глубина — area = (длина−0,6)×(глубина−0,6).
Описание: """${txt}"""`,{modelTier:"quick"});
        let n=0; if(res&&res.pkg&&OfficeKB.PACKAGES[res.pkg]){ st.pkg=res.pkg; st.opts={}; st.counts={}; n++; }
        if(res&&res.w&&res.d){ st.w=+res.w; st.d=+res.d; st.autoB=false; n++; }
        if(res&&res.h){ st.h=+res.h; n++; } if(res&&res.area){ st.area=+res.area; n++; } else if(res&&res.w&&res.d){ st.area=Math.round((res.w-0.6)*(res.d-0.6)); }
        if(res&&res.managers){ st.counts.cabinet=+res.managers; n++; } if(res&&res.name){ st.name=res.name; n++; }
        $m("w_pks").innerHTML=cards(); refresh(); sEl.textContent=n?`Заполнено полей: ${n}. Проверьте и нажмите «Создать план».`:"Не удалось понять описание — заполните поля вручную."; }
      catch(err){ sEl.textContent="Не получилось разобрать описание, заполните поля вручную."; }
      t.disabled=false; } });
  m.addEventListener("input",e=>{ const t=e.target, n=+String(t.value).replace(",",".");
    if(t.id==="w_area"||t.id==="w_rng"){ if(n>0){ st.area=n; refresh(); } return; }
    if(t.id==="w_w"||t.id==="w_d"||t.id==="w_h"){ if(n>0){ st[t.id.slice(2)]=n; st.autoB=false; $m("w_autoB").checked=false; draw(); } return; }
    if(t.id==="w_name"){ st.name=t.value; return; }

  m.addEventListener("change",e=>{ const t=e.target;
    if(t.dataset.opt){ st.opts[t.dataset.opt]=t.checked; draw(); }
    if(t.id==="w_autoB"){ st.autoB=t.checked; refresh(); }
    if(t.id==="w_mezz"){ st.mezz=t.value; draw(); } });
}
/* ---------- Новый офис: размеры → три варианта наполнения → план собирается сам ---------- */
function planThumb(P){ const keep=S; try{ S=P; const b=P.b; return `<svg viewBox="-0.4 -0.4 ${b.w+0.8} ${b.d+0.8}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${planMarkup(0,{export:true})}</svg>`; } catch(e){ return ""; } finally{ S=keep; } }
function newOfficeDialog(){
  const prev=(S.meta&&S.meta.params)||{};
  const st={ w:+S.b.w||30, d:+S.b.d||12, h:+S.b.h||4.5, mezz:"auto", name:"Офис продаж", pick:null, res:null };
  const m=document.createElement("div"); m.className="modal"; const $m=id=>m.querySelector("#"+id);
  m.innerHTML=`<div class="dlg wiz nv" role="dialog" aria-label="Новый проект"><h3>Новый проект</h3>
  <p class="note">Задайте размеры помещения — Claude-движок сам соберёт зонирование в трёх вариантах наполнения. Выберите один — дальше всё можно двигать мышкой.</p>
  <div class="row four">
    <label class="f">Длина вдоль улицы, м<input id="n_w" type="number" step=".5" min="6" value="${st.w}"></label>
    <label class="f">Глубина, м<input id="n_d" type="number" step=".5" min="5" value="${st.d}"></label>
    <label class="f">Высота потолка, м<input id="n_h" type="number" step=".1" min="2.7" value="${st.h}"></label>
    <label class="f">Второй уровень<select id="n_mz"><option value="auto">Антресоль, если ≥ 6,2 м</option><option value="yes">Антресоль — да</option><option value="no">Без антресоли</option></select></label></div>
  <div class="row"><label class="f">Название<input id="n_name" value="${esc(st.name)}"></label><div class="f nvsum" id="n_sum"></div></div>
  <div class="vcards" id="n_cards"><p class="note">Считаю варианты…</p></div>
  <details class="nvlog"><summary>Как движок принял решения</summary><div id="n_log" class="note"></div></details>
  <div class="actions"><button class="btn primary" id="n_go" disabled>Создать план</button><button class="btn" id="n_prog">Настроить программу…</button><button class="btn" id="n_blank" title="Только стены по размерам — расставите всё сами">Пустое помещение</button><span class="spacer"></span><button class="btn" id="n_cancel">Отмена</button></div></div>`;
  document.body.appendChild(m);
  const rec=A=> A<200?"S":A<450?"M":"L";
  const draw=()=>{
    const A=Math.round((st.w-0.6)*(st.d-0.6));
    $m("n_sum").innerHTML=`Площадь внутри стен <b>${m2(A)} м²</b>${(st.mezz==="yes"||(st.mezz==="auto"&&st.h>=6.2))?` + антресоль ≈ ${m2(A*0.2)} м²`:""}`;
    let res; try{ res=OfficeKB.variants({w:st.w,d:st.d,h:st.h,mezz:st.mezz,name:st.name}); }catch(err){ $m("n_cards").innerHTML=`<p class="note">${esc(err.message)}</p>`; return; }
    st.res=res; if(!st.pick) st.pick=rec(A);
    $m("n_cards").innerHTML=res.map(r=>{ const P=OfficeKB.PACKAGES[r.pkg], v=r.vars, rows=r.program.rows, has=k=>rows.some(x=>x.key===k);
      const extras=[["kids","детская"],["cafe",r.pkg==="L"?"бар":"кофе"],["bank","банк"],["showroom","шоурум"],["media","медиа"],["director","РОП"],["cashier","касса"]].filter(([k])=>has(k)).map(x=>x[1]);
      const meet=(rows.find(x=>x.key==="meet")||{}).n||0, vip=(rows.find(x=>x.key==="vip")||{}).n||0;
      const ok=!r.missing.length;
      return `<button class="vc ${st.pick===r.pkg?"on":""}" data-v="${r.pkg}"><div class="vt">${planThumb(r.project)}</div>
        <div class="vh"><b>${esc(P.name)}</b>${rec(A)===r.pkg?`<span class="chip good">рекомендуем для ${m2(A)} м²</span>`:""}${ok?"":`<span class="chip warn">не всё поместилось</span>`}</div>
        <small>${esc(P.sub)}</small>
        <ul><li><b>${v.M}</b> ${has("cabinet")&&rows.find(x=>x.key==="cabinet").border==="none"?"мест консультаций":"кабинетов менеджеров"}</li>
        <li>ожидание <b>${r.project.meta.seatsPlaced||v.seats}</b> мест · макет ${has("maket")?r.program.maket.replace("x","×"):"— экран"}</li>
        <li>${meet?`переговорных ${meet}`:""}${meet&&vip?" · ":""}${vip?`сделочных / VIP ${vip}`:""}</li>
        ${extras.length?`<li>${extras.join(" · ")}</li>`:""}${r.mezz?"<li>бэк-офис, РОП, кухня — на антресоли</li>":""}</ul></button>`; }).join("");
    const sel=res.find(r=>r.pkg===st.pick);
    $m("n_log").innerHTML=sel?(sel.log.length?`<ol>${sel.log.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"Программа уровня поместилась без изменений.")+(sel.warnings.length?`<p>Замечания раскладки: ${sel.warnings.map(esc).join(" ")}</p>`:""):"";
    $m("n_go").disabled=!sel;
  };
  let tm=null; const later=()=>{ clearTimeout(tm); tm=setTimeout(draw,250); };
  setTimeout(draw,30);
  m.addEventListener("input",e=>{ const t=e.target, n=+String(t.value).replace(",","."); if(t.id==="n_name"){ st.name=t.value; return; }
    if(t.id==="n_w"&&n>=6){ st.w=n; later(); } if(t.id==="n_d"&&n>=5){ st.d=n; later(); } if(t.id==="n_h"&&n>=2.5){ st.h=n; later(); } });
  m.addEventListener("change",e=>{ if(e.target.id==="n_mz"){ st.mezz=e.target.value; draw(); } });
  m.addEventListener("click",async e=>{ const t=e.target, vc=t.closest("[data-v]");
    if(vc){ st.pick=vc.dataset.v; m.querySelectorAll(".vc").forEach(x=>x.classList.toggle("on",x.dataset.v===st.pick)); const sel=st.res&&st.res.find(r=>r.pkg===st.pick);
      if(sel) $m("n_log").innerHTML=(sel.log.length?`<ol>${sel.log.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"Программа уровня поместилась без изменений.")+(sel.warnings.length?`<p>Замечания раскладки: ${sel.warnings.map(esc).join(" ")}</p>`:""); $m("n_go").disabled=false; return; }
    if(t===m||t.id==="n_cancel") return m.remove();
    if(t.id==="n_prog"){ m.remove(); wizardDialog(); return; }
    if(t.id==="n_blank"){ await flush(); S=blankProject(st.w,st.d,st.h); S.name=st.name||S.name; emptyOff=true; projectId=uid(); sel_reset(); m.remove(); setView("2d"); fit(); commit(); toast("Пустое помещение создано — берите помещения и мебель из библиотеки слева"); return; }
    if(t.id==="n_go"){ const sel=st.res&&st.res.find(r=>r.pkg===st.pick); if(!sel) return; await flush();
      S=OfficeKB.autoPlan({pkg:st.pick,w:st.w,d:st.d,h:st.h,mezz:st.mezz,name:st.name}).project; S.name=st.name||S.name;
      S.meta.params=Object.assign({},S.meta.params,{pkg:st.pick,name:S.name}); projectId=uid(); sel_reset(); m.remove(); setView("2d"); fit(); commit(); tab="ex"; setTabs(); renderPane();

/* ============================================================ Claude: управление планом
 * 1) Claude на компьютере (Desktop / Code) через MCP-сервер office-planner — как Blender MCP: живая синхронизация по SSE.
 * 2) Помощник прямо здесь (в claude.ai): текст → команды OfficeKB.OPS → план. */
const LIVE={base:null, es:null, client:"b"+uid(), pushT:null, applying:false, on:false};
function setLive(on){ LIVE.on=on; const b=$("#bClaude"); if(b){ b.classList.toggle("live",!!on); b.textContent=on?"● Claude":"Claude"; b.title=on?"Claude подключён: изменения синхронизируются":"Подключить Claude"; } }
async function livePing(base){ try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),1500); const r=await fetch(base+"/api/ping",{signal:c.signal}); clearTimeout(t); const j=await r.json(); return j&&j.name==="office-planner"; }catch(e){ return false; } }
async function liveFind(){ if(location.protocol.startsWith("http")&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&await livePing(location.origin)) return location.origin;
  for(let p=8765;p<=8775;p++){ const b="http://127.0.0.1:"+p; if(await livePing(b)) return b; } return null; }
function liveConnect(base, pushFirst){
  if(LIVE.es) LIVE.es.close(); LIVE.base=base;
  const start=()=>{ const es=LIVE.es=new EventSource(base+"/api/events?client="+LIVE.client);
    es.addEventListener("state",e=>{ const m=JSON.parse(e.data); setLive(true); if(m.src===LIVE.client) return;
      if(JSON.stringify(m.project)===JSON.stringify(S)) return;
      LIVE.applying=true; try{ pushUndo(); S=m.project; if(sel&&!byId(sel)) sel=null; if(level===1&&!S.items.some(i=>i.lv===1)) level=0; render(); scheduleSave(); }finally{ LIVE.applying=false; }
      if(m.src!=="server") setStatus("Claude изменил план · "+new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit",second:"2-digit"})); });
    es.addEventListener("render",async e=>{ const m=JSON.parse(e.data); let png=null; try{ png=await snapshotPNG(m); }catch(err){ console.warn(err); }
      fetch(base+"/api/render",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({req:m.req,png})}).catch(()=>{}); });
    es.onerror=()=>setLive(false); };
  if(pushFirst) fetch(base+"/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({client:LIVE.client,project:S})}).then(start,start); else start();
}
function livePush(){ if(!LIVE.base||LIVE.applying||!LIVE.on) return; clearTimeout(LIVE.pushT);
  LIVE.pushT=setTimeout(()=>fetch(LIVE.base+"/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({client:LIVE.client,project:S})}).catch(()=>setLive(false)),300); }
// картинка плана для Claude: 2D — лист с экспликацией, 3D — снимок сцены
async function snapshotPNG(m){
  if(m.view==="3d"){ const was=view, v0={...V}, o0=R3?{theta:R3.O.theta,phi:R3.O.phi,r:R3.O.r,t:R3.O.target.clone()}:null;
    setView("3d"); build3D(); if(!R3) return null; resize3D(); camReset(m.cam||"iso"); const url=R3.renderer.domElement.toDataURL("image/png");
    if(o0){ Object.assign(R3.O,{theta:o0.theta,phi:o0.phi,r:o0.r}); R3.O.target.copy(o0.t); draw3D(); }   // вернуть камеру и масштаб, как были
    if(was!=="3d"){ setView(was); Object.assign(V,v0); renderPlan(); } return url; }
  const svgTxt=exportSVG(), vb=svgTxt.match(/viewBox='0 0 ([\d.]+) ([\d.]+)'/); const W=+vb[1], H=+vb[2], px=Math.min(1800, Math.max(1100, W*32)), sc=px/W;
  const img=new Image(); const url=URL.createObjectURL(new Blob([svgTxt],{type:"image/svg+xml"}));
  await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; });
  const c=document.createElement("canvas"); c.width=Math.round(W*sc); c.height=Math.round(H*sc); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/png");
}

const AI_SYS=()=>`Ты — архитектор-планировщик офисов продаж девелопера и управляешь «Планировщиком офиса продаж» командами.
Координаты в метрах: X вдоль дороги (0 — левый торец), Y вглубь (0 — глухая задняя стена, Y=${S.b.d} — фасад с витражом и входом). Наружные стены 0,3 м.
Логика: публичная зона у витража и входа (тамбур, ресепшен видно от входа, ожидание, макет, кофе, детская); вдоль глухой стены — кабинеты менеджеров 3,0×3,2 (стекло в зал), переговорные 4,5×3,2; сделочная/VIP, ипотека ближе к служебному блоку; служебные (с/у, кухня, КУИ, щитовая) в торце; бэк-офис — в торце или на антресоли (lv 1). Клиент не ходит через служебные. Проходы ≥ 1,5 м, ось входа свободна. Не накладывай помещения друг на друга (кроме зон sub внутри зала).
Команды (массив ops, выполняются по порядку):
{"op":"add_room","name":"Кабинет менеджера","x":..,"y":..,"w":3,"h":3.2,"lv":0,"border":"none|wall|glass","furnish":true} — тип и мебель по названию; без x/y место найдётся само (near: facade|back|left|right|center)
{"op":"update","id":"<id или название>","x":..,"y":..,"w":..,"h":..,"dx":..,"dy":..,"new_name":"..","border":"..","color":"#RRGGBB","rot":90} — помещение двигается с мебелью
{"op":"delete","id":"<id или название>"}
{"op":"add_item","k":"<ключ>","size":"<типоразмер, напр. «на 8»>","x":..,"y":..,"rot":0,"room":"<помещение>","count":1,"dir":"x|y"} — ключи: ${OfficeKB.FURN.filter(f=>!/Конструкции/.test(f[2])).map(f=>f[0]+" "+f[3]+"×"+f[4]).join(", ")}
{"op":"furnish","room":"<помещение>"} — расставить мебель по типу; {"op":"clear","room":".."}
{"op":"add_set","set":"mgr|cons|rop|meet|vip|lounge|recep|kitchen|back|kids|cafe|ward|show|maket|arch|wc|focus","room":"..","variant":"auto"|номер|"на 8"} — готовый набор мебели стандартных размеров (или "x","y" вместо room); {"op":"sets_all","style":"scandi|classic|modern|premium|green"} — обставить наборами все помещения (стиль — цвета дерева, фасадов и ткани); у add_set тоже есть "style"
{"op":"add_door","room":"..","side":"n|s|e|w","width":0.9}; {"op":"add_wall","kind":"part|glass|block|rail","x1":..,"y1":..,"x2":..,"y2":..}
{"op":"auto","pkg":"S|M|L","w":..,"d":..,"h":..} — собрать зонирование заново по размерам и варианту наполнения (S Базовый — максимум мест продаж, M Стандарт, L Премиум); {"op":"building","w":..,"d":..,"h":..}
Верни ТОЛЬКО JSON: {"say":"коротко по-русски, что сделал и что посоветуешь","ops":[...]}. Если просьба непонятна или невыполнима — ops пустой, say с вопросом.`;
async function aiRun(txt, out){
  const plan=OfficeKB.describe(S,{ascii:true});
  out.innerHTML=`<p class="note">Думаю…</p>`;
  let res; try{ res=await sampleCap.json(AI_SYS()+`\n\nТЕКУЩИЙ ПЛАН:\n${plan}\n\nЗАДАЧА ПОЛЬЗОВАТЕЛЯ: """${txt}"""`); }catch(e){ out.innerHTML=`<p class="note">Не получилось связаться с Claude: ${esc(e.message||e)}</p>`; return; }
  const ops=Array.isArray(res&&res.ops)?res.ops:[]; pushUndo(); const r=OfficeKB.applyAll(S,ops); if(level===1&&!S.items.some(i=>i.lv===1)) level=0; fit(); commit();
  const ch=OfficeKB.checks(S), red=ch.filter(c=>c.level==="red").length;
  out.innerHTML=`<p>${esc(res&&res.say||"Готово.")}</p>${r.length?`<ul class="ailog">${r.map(x=>`<li class="${x.ok?"":"bad"}">${esc(x.msg)}</li>`).join("")}</ul>`:""}<p class="note">Проверки: ${red} важных, ${ch.length-red} прочих. Отменить всё — ↶ (Ctrl+Z).</p>`;
}
function claudeDialog(){

  m.innerHTML=`<div class="dlg" role="dialog" aria-label="Claude" style="max-width:640px"><h3>Claude управляет планом</h3>
  ${sampleCap?`<h5>Помощник здесь</h5><p class="note">Напишите, что сделать — Claude сам расставит помещения и мебель по логике офиса продаж.</p>
  <textarea id="ai_t" rows="3" style="width:100%" placeholder="Например: добавь вторую переговорную на 8 человек рядом с VIP, а детскую перенеси подальше от входа"></textarea>
  <div class="actions"><button class="btn primary" id="ai_go">Выполнить</button><span class="spacer"></span></div><div id="ai_out"></div>`:""}
  <h5>Claude на компьютере (как Blender)</h5>
  <p class="note" id="lv_st">${LIVE.on?"● Подключено: "+esc(LIVE.base)+". Всё, что делает Claude, сразу появляется здесь, а ваши правки видит Claude.":"Не подключено."}</p>
  <div class="actions"><button class="btn primary" id="lv_go">${LIVE.on?"Переподключить":"Подключить"}</button>${LIVE.on?`<button class="btn" id="lv_off">Отключить</button>`:""}<span class="spacer"></span><button class="btn" id="lv_close">Закрыть</button></div>
  <details><summary>Как установить (один раз)</summary><ol class="note">
  <li>Скачайте <a href="${dl}office-planner-mcp.zip" target="_blank" rel="noopener">office-planner-mcp.zip</a> и распакуйте (например, в Документы). Нужен Node.js 18+ (nodejs.org) — или установите <a href="${dl}office-planner.mcpb" target="_blank" rel="noopener">office-planner.mcpb</a> двойным щелчком в Claude Desktop (Node не нужен).</li>
  <li>Claude Desktop → Настройки → Developer → Edit Config, добавьте:<br><code>{"mcpServers":{"office-planner":{"command":"node","args":["ПУТЬ\\office-planner-mcp\\server.js"]}}}</code><br>Claude Code: <code>claude mcp add office-planner -- node ПУТЬ/server.js</code></li>
  <li>Перезапустите Claude и напишите: «Открой планировщик и собери офис продаж на 280 м²». Claude откроет http://localhost:8765 — там всё видно вживую. Этот сайт тоже можно подключить кнопкой «Подключить».</li></ol></details></div>`;
  document.body.appendChild(m); const close=()=>m.remove();
  m.addEventListener("click",async e=>{ const t=e.target; if(t===m||t.id==="lv_close") return close();
    if(t.id==="lv_off"){ if(LIVE.es) LIVE.es.close(); LIVE.base=null; setLive(false); close(); }
    if(t.id==="lv_go"){ $m("lv_st").textContent="Ищу Claude на этом компьютере (порты 8765–8775)…"; const b=await liveFind();
      if(!b){ $m("lv_st").innerHTML="Не нашёл. Проверьте, что MCP-сервер office-planner подключён в Claude и Claude запущен (см. «Как установить»). Safari может блокировать связь с сайта — откройте http://localhost:8765."; return; }
      const same=b===location.origin; liveConnect(b, !same); $m("lv_st").textContent="● Подключено: "+b+(same?"":". Текущий план отправлен Claude."); }
    if(t.id==="ai_go"){ const txt=$m("ai_t").value.trim(); if(!txt) return; t.disabled=true; await aiRun(txt,$m("ai_out")); t.disabled=false; } });
}
